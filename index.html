<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIT-OUT IQ — Production Platform for Fit-Out</title>
<style>
  :root{--amber:#FFB300;--steel:#1c1f24;--panel:#24282f;--line:#363b44;--green:#3ddc84;--blue:#5db8ff;--red:#ff5d5d;--txt:#e7e9ec;--mut:#8b929c;--mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:var(--steel);color:var(--txt);font-family:var(--mono);padding-bottom:50px}
  input:focus,select:focus{outline:1px solid var(--amber)}
  button{font-family:var(--mono);cursor:pointer}
  .hide{display:none!important}
  .auth{max-width:440px;margin:40px auto;padding:0 18px}
  .authCard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .authHead{padding:22px;border-bottom:2px solid var(--amber);text-align:center}
  .logo{color:var(--amber);font-size:26px;letter-spacing:-2px}
  .authTitle{font-size:26px;font-weight:800;letter-spacing:3px;margin-top:6px}
  .authSub{font-size:9px;letter-spacing:2.5px;color:var(--mut);margin-top:4px}
  .authBody{padding:22px}
  .demoBanner{background:#2d2410;border:1px dashed var(--amber);color:var(--amber);font-size:10px;padding:8px 10px;border-radius:3px;margin-bottom:18px;line-height:1.5}
  .lbl{font-size:10px;letter-spacing:1px;color:var(--mut);display:block;margin:14px 0 5px}
  .inp{width:100%;background:var(--steel);color:#fff;border:1px solid var(--line);padding:11px 12px;font-family:var(--mono);font-size:14px;border-radius:3px}
  .plans{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .plan{display:flex;justify-content:space-between;align-items:center;background:var(--steel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
  .plan.on{border-color:var(--amber);background:#2a2614}
  .planName{font-size:12px;font-weight:700}.planDesc{font-size:9px;color:var(--mut);margin-top:2px}
  .planPrice{font-size:16px;font-weight:800;color:var(--amber)}
  .cta{width:100%;background:var(--amber);color:#000;border:none;padding:15px;font-weight:800;font-size:13px;letter-spacing:1px;border-radius:4px;margin-top:20px}
  .trial{text-align:center;font-size:10px;color:var(--green);margin-top:12px}
  .err{color:var(--red);font-size:11px;margin-top:8px;min-height:14px}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2px solid var(--amber);flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{color:var(--amber);font-size:22px;letter-spacing:-2px}
  .title{font-size:22px;font-weight:800;letter-spacing:2px;line-height:1}
  .sub{font-size:9px;letter-spacing:2.5px;color:var(--mut);margin-top:3px}
  .headBtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .gbtn{background:transparent;color:var(--amber);border:1px solid var(--line);padding:9px 12px;font-weight:700;font-size:11px;letter-spacing:1px;border-radius:2px}
  .pbtn{background:var(--amber);color:#000;border:none;padding:9px 14px;font-weight:800;font-size:11px;letter-spacing:1px;border-radius:2px}
  .unit{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .unit button{background:transparent;color:var(--mut);border:none;padding:8px 11px;font-size:11px;font-weight:700}
  .unit button.on{background:var(--amber);color:#000}
  .trialBar{background:#0f2417;color:var(--green);font-size:11px;text-align:center;padding:6px;letter-spacing:1px}
  .zoneBar{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .zlbl{font-size:10px;letter-spacing:2px;color:var(--mut)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .chip{background:var(--steel);color:#b9c0ca;border:1px solid var(--line);padding:7px 12px;font-size:11px;border-radius:2px}
  .chip.on{background:var(--amber);color:#000;font-weight:700;border-color:var(--amber)}
  .chipX{background:transparent;color:var(--red);border:none;font-size:10px;padding:0 4px}
  .zinp{background:var(--steel);color:#fff;border:1px solid var(--line);padding:8px 10px;font-size:12px;border-radius:2px;width:150px;font-family:var(--mono)}
  .zadd{background:#2d2410;color:var(--amber);border:1px solid var(--amber);padding:8px 12px;font-size:11px;font-weight:700;border-radius:2px}
  .controlBar{display:flex;justify-content:center;padding:12px 18px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{background:transparent;color:var(--mut);border:1px solid var(--line);padding:9px 16px;font-weight:700;font-size:11px;letter-spacing:1px;border-radius:2px}
  .tab.on{background:var(--amber);color:#000;font-weight:800;border-color:var(--amber)}
  .body{padding:18px 26px;max-width:1600px;margin:0 auto}
  .settings{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .fl{font-size:9px;letter-spacing:1.5px;color:var(--mut)}
  .fi{background:var(--panel);color:var(--amber);border:1px solid var(--line);padding:10px 12px;font-size:16px;font-weight:700;width:120px;border-radius:2px;font-family:var(--mono)}
  .toggle{background:var(--panel);color:var(--mut);border:1px solid var(--line);padding:11px 14px;font-size:11px;font-weight:700;border-radius:2px;letter-spacing:1px}
  .toggle.on{background:#0f2417;color:var(--green);border-color:var(--green)}
  .grainCard{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:16px;padding:14px}
  .grainLbl{font-size:10px;letter-spacing:1.5px;color:var(--mut);margin-bottom:10px}
  .grainRow{display:flex;gap:10px;flex-wrap:wrap}
  .grainBtn{position:relative;flex:1 1 140px;background:var(--steel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;text-align:left;color:#fff;font-family:var(--mono)}
  .grainBtn.on{border-color:var(--amber);background:#2a2614}
  .grainBtn.best{box-shadow:0 0 0 1px var(--green)}
  .gT{font-size:12px;font-weight:800;letter-spacing:1px}.gD{font-size:9px;color:var(--mut);margin-top:2px}
  .gP{font-size:24px;font-weight:800;margin-top:8px}
  .bestTag{position:absolute;top:8px;right:10px;font-size:9px;color:var(--green);font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:16px;overflow:hidden}
  .cardHead{padding:11px 16px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--amber);border-bottom:1px solid var(--line);background:#1f2329;display:flex;justify-content:space-between;align-items:center}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th{text-align:left;padding:9px 7px;font-size:10px;letter-spacing:1px;color:var(--mut);border-bottom:1px solid var(--line);font-weight:600}
  th.r{text-align:right}
  td{padding:5px 5px;border-bottom:1px solid #2c313a}td.r{text-align:right}
  .cell{background:transparent;color:#fff;border:1px solid transparent;padding:7px 8px;font-size:13px;width:100%;border-radius:2px;font-family:var(--mono)}
  .num{background:var(--steel);color:#fff;border:1px solid var(--line);padding:7px 8px;font-size:13px;width:74px;text-align:right;border-radius:2px;font-family:var(--mono)}
  .numS{width:54px}
  .sel{background:var(--steel);color:#fff;border:1px solid var(--line);padding:6px;font-size:12px;border-radius:2px;font-family:var(--mono)}
  .cutSize{color:var(--blue);font-size:12px;font-weight:700}
  .cost{color:var(--green);font-size:12px;font-weight:700}
  .del{background:transparent;color:var(--red);border:none;font-size:14px;padding:4px}
  .add{width:100%;background:#1f2329;color:var(--amber);border:none;border-top:1px solid var(--line);padding:12px;font-weight:700;font-size:12px;letter-spacing:1px}
  .stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .stat{flex:1 1 90px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
  .stat.big{border-color:var(--amber)}.stat.money{border-color:var(--green)}
  .sv{font-size:26px;font-weight:800;line-height:1}
  .sl{font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-top:6px}
  .barRow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .barIdx{font-size:11px;color:var(--mut);width:42px;flex-shrink:0;display:flex;gap:3px;align-items:center}
  .bar{height:30px;display:flex;background:#15181d;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
  .seg{display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(0,0,0,.4);min-width:0}
  .segT{font-size:10px;font-weight:700;color:#000;white-space:nowrap}
  .dropSeg{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#23272e,#23272e 4px,#1a1d22 4px,#1a1d22 8px)}
  .dropT{font-size:9px;color:#7a828d;white-space:nowrap}
  .sheetGrid{display:flex;flex-wrap:wrap;gap:18px;padding:16px}
  .sheetWrap{display:flex;flex-direction:column;gap:6px}
  .sheetIdx{font-size:10px;letter-spacing:1px;color:var(--mut)}
  .sheet{position:relative;background:#15181d;border:1px solid var(--line);border-radius:2px}
  .part{position:absolute;border:1px solid rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;overflow:hidden;text-align:center}
  .orderCard{background:linear-gradient(135deg,#2a2614,#24282f);border:1px solid var(--amber);border-radius:6px;margin-bottom:16px;overflow:hidden}
  .orderHead{padding:14px 18px;font-size:13px;font-weight:800;letter-spacing:2px;color:var(--amber);border-bottom:1px solid var(--line)}
  .orderBody{padding:8px 18px 18px}
  .orderLine{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;font-size:15px}
  .orderQty{font-size:24px;font-weight:800;color:#fff}
  .orderSub{font-size:11px;color:var(--mut);margin-top:4px}
  .orderTotal{display:flex;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:2px solid var(--amber);font-size:14px;font-weight:800;letter-spacing:1px;color:var(--amber)}
  .bigPrint{width:100%;background:var(--amber);color:#000;border:none;padding:16px;font-weight:800;font-size:13px;letter-spacing:1.5px;border-radius:4px;margin-bottom:10px}
  .empty{padding:40px;text-align:center;color:#6b7280;font-size:13px}
  .bank{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
  .bankItem{background:#0f2417;border:1px solid var(--green);border-radius:6px;padding:8px 12px;min-width:120px}
  .bankSize{color:var(--green);font-weight:800;font-size:14px}
  .bankMeta{color:var(--mut);font-size:9px;margin-top:3px}
  footer{max-width:1600px;margin:0 auto;padding:0 26px;font-size:10px;color:#6b7280;line-height:1.6}
  .hint{font-size:10px;color:var(--mut);padding:0 16px 12px}
  /* ---- RAL Paint Mixer tool (Procurement) — all rules scoped under .ralTool
     to avoid colliding with Fit-Out IQ's own .card/.note/etc classes ---- */
  .ralTool .rlayout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){.ralTool .rlayout{grid-template-columns:1fr}}
  .ralTool .rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .ralTool .rcard h2{font-size:14px;margin:0 0 12px;color:#bbb;text-transform:uppercase;letter-spacing:.5px}
  .ralTool select.rsel{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:var(--steel);color:#eee;font-size:14px;margin-bottom:12px}
  .ralTool .rswatches{display:flex;gap:10px;margin-bottom:12px}
  .ralTool .rswatch-box{flex:1;text-align:center}
  .ralTool .rswatch{height:70px;border-radius:8px;border:1px solid #444;margin-bottom:6px}
  .ralTool .rswatch-box span{font-size:11px;color:#999}
  .ralTool .rhex{font-size:12px;color:#ccc;font-family:monospace}
  .ralTool .rmatch{text-align:center;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;font-weight:600}
  .ralTool .rslider-row{margin-bottom:14px}
  .ralTool .rslider-row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:#ddd}
  .ralTool .rval{color:#999;font-family:monospace}
  .ralTool input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;outline:none;background:var(--steel)}
  .ralTool input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #000;cursor:pointer;margin-top:-1px}
  .ralTool input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #000;cursor:pointer}
  .ralTool input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:transparent}
  .ralTool .rswatch-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
  .ralTool .rnote{font-size:12px;color:#888;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .ralTool .rreset-btn{width:100%;padding:10px;border-radius:8px;border:none;background:var(--steel);color:#eee;font-size:13px;cursor:pointer;margin-top:4px}
  .ralTool .rreset-btn:hover{background:#3a3a3d}
  /* ---- RTL support (Urdu, Arabic) — scoped to whatever container carries
     dir="rtl", so English-language screens for other roles are unaffected ---- */
  [dir="rtl"] header{flex-direction:row-reverse}
  [dir="rtl"] .hdrRight{flex-direction:row-reverse}
  [dir="rtl"] .cardHead{flex-direction:row-reverse;text-align:right}
  [dir="rtl"] .field{text-align:right}
  [dir="rtl"] .fl{text-align:right;display:block}
  [dir="rtl"] .hint{text-align:right}
  [dir="rtl"] td,[dir="rtl"] th{text-align:right}
  [dir="rtl"] td.r,[dir="rtl"] th.r{text-align:left}
</style>
</head>

// ============================================================================
//  FIT-OUT IQ CUT LIST — fit-out estimator (single-file, hostable)
//  Guillotine nester · Offcut Bank · Paint calculator · Price Book auto-costing
//  Demo accounts/paywall (NOT real payments). Metric/imperial. Grain along length.
// ============================================================================
// ---- Supabase connection ----
// Bump this string on every deploy. Used only to detect when a newer version
// is live, so people see a "click to refresh" banner instead of being silently
// switched to new features mid-task.
// ---- Update detection ----
// This used to rely on bumping a version string by hand on every deploy, which
// meant one forgotten edit silently disabled it for everyone. Now it asks the
// server for the file's fingerprint (ETag / Last-Modified) using a cheap HEAD
// request and compares it to the one we loaded with. Any redeploy changes the
// fingerprint, so it works whether or not anyone remembers to update anything.
const APP_VERSION='2026-08-04-a';   // display only - not what triggers the banner
let _appFingerprint=null;
function fingerprintOf(res){
  return (res.headers.get('etag')||'') + '|' + (res.headers.get('last-modified')||'');
}
async function checkForUpdate(){
  try{
    const res=await fetch(window.location.href,{method:'HEAD',cache:'no-store'});
    if(!res.ok)return;
    const fp=fingerprintOf(res);
    if(!fp||fp==='|')return;                 // server gave us nothing usable
    if(_appFingerprint===null){_appFingerprint=fp;return;}   // first run: remember it
    if(fp!==_appFingerprint){
      const b=document.getElementById('updateBanner');
      if(b)b.style.display='block';
    }
  }catch(e){}   // offline or blocked - never bother the user about it
}
checkForUpdate();                       // record the fingerprint we loaded with
setInterval(checkForUpdate,3*60*1000);  // then re-check every 3 minutes
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible')checkForUpdate(); });
window.addEventListener('online',checkForUpdate);

// Wrap any promise so it rejects if it takes too long, instead of hanging the app
// forever when Supabase is slow or having an outage. Keeps sign-in / page load from
// silently freezing (buttons appear dead). Default 12s.
function withTimeout(promise,ms,label){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'Request')+' timed out — the server may be temporarily unavailable. Please try again shortly.')),ms||12000))
  ]);
}

// Mirrors the 9-stage pipeline from the factory's own production-tracking Excel.
const PROD_STAGES=['Not Started','Drawing','Sample Approved','Started','Machinery','Assembly','Painting','Delivery','Site'];
const PROD_FLAGS=['—','On Hold','Blocked','Priority'];
const PROD_DATE_FIELD={'Drawing':'drawing_date','Sample Approved':'sample_approved_date','Started':'started_date','Machinery':'machinery_date','Assembly':'assembly_date','Painting':'painting_date','Delivery':'delivery_date','Site':'site_date'};
function prodStageIndex(stage){const i=PROD_STAGES.indexOf(stage);return i<0?0:i;}
// compute progress / aging / cycle time for one production item — same logic as the
// Excel's Progress / Days in stage / Aging / Cycle (days) columns.
function prodItemCalc(it){
  const idx=prodStageIndex(it.stage);
  const progress=idx/8;
  const dateFields=['drawing_date','sample_approved_date','started_date','machinery_date','assembly_date','painting_date','delivery_date','site_date'];
  const dates=dateFields.map(f=>it[f]).filter(Boolean).map(d=>new Date(d)).filter(d=>!isNaN(d));
  const lastDate=dates.length?new Date(Math.max(...dates)):null;
  const firstDate=dates.length?new Date(Math.min(...dates)):null;
  const today=new Date();
  const daysSince=d=>Math.floor((today-d)/86400000);
  let daysInStage='', aging='Not dated';
  if(idx>=8){daysInStage='Done';aging='Done';}
  else if(!lastDate){daysInStage='';aging='Not dated';}
  else{const d=daysSince(lastDate);daysInStage=d;aging=d>7?'Aging':'On track';}
  const cycleDays=(dates.length>=2)?Math.floor((lastDate-firstDate)/86400000):null;
  return {progress, daysInStage, aging, cycleDays, lastDate, firstDate};
}

// READY? / To-approve — matches the Excel: READY only once all 6 checks are done.
function prodReadyCalc(it){

  return {done, total:6, ready:done===6, toApprove:6-done};
}
// merge a base type list with any names the person has typed in before (remembered in
// store), so custom entries show up as normal dropdown options next time — not just
// hidden behind "Other" every time.
function mergedTypes(base,custom){
  const middle=base.filter(x=>x!==''&&x!=='Other');
  const extra=(custom||[]).filter(c=>c&&!middle.includes(c));
  return ['',...middle,...extra,'Other'];
}

async function cloudSave(){
  if(!sb||!store.account)return;
  // if a shared project (someone else's) is open, this account is VIEW-ONLY — don't
  // try to save, since only the owning contractor can edit the cut-list data.
  if(_workspaceId && _workspaceOwnerId && _workspaceOwnerId!==store.account.uid){ store.syncState='view-only'; updateSyncBadge(); return; }

    if(_workspaceId){

        name:store.projectName||'Untitled project', visibility:'private', data:payload

// ===================== MESSAGING =====================
// Open a message thread for an order (works for contractor, manager, supplier)
let _msgChannel=null;
let _ordersChannel=null;
function unsubscribeOrders(){
  if(_ordersChannel&&sb){try{sb.removeChannel(_ordersChannel);}catch(e){}_ordersChannel=null;}
}
function subscribeOrders(){
  unsubscribeOrders();
  if(!sb||!store.account)return;
  const acct=store.account.accountType;
  _ordersChannel=sb.channel('orders-'+store.account.uid)
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},(payload)=>{
      const row=payload.new||payload.old;
      if(!row)return;
      // only react to orders relevant to me, then refresh the right list
      let relevant=false;
      if(acct==='contractor' && row.contractor_id===store.account.uid) relevant=true;
      if(acct==='manager' && row.company_id===store.account.companyId) relevant=true;
      if(acct==='supplier' && row.supplier_id===store.account.uid) relevant=true;
      if(!relevant)return;
      if(acct==='contractor'){ store.myOrdersLoaded=false; loadMyOrders(); }
      else if(acct==='manager'){ store.apprLoaded=false; loadApprovals(); }
      else if(acct==='supplier'){ store.incomingLoaded=false; loadIncoming(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+store.account.uid},(payload)=>{
      const m=payload.new; if(!m||!m.order_id)return;
      // if this order's thread is open, it'll be marked read; otherwise bump the badge
      if(store.threadOrderId===m.order_id)return;
      store.unreadByOrder={...store.unreadByOrder,[m.order_id]:(store.unreadByOrder[m.order_id]||0)+1};
      render();
    })
    .subscribe();
}
function unsubscribeThread(){
  if(_msgChannel&&sb){try{sb.removeChannel(_msgChannel);}catch(e){}_msgChannel=null;}
}
function subscribeThread(orderId){
  unsubscribeThread();
  if(!sb)return;
  _msgChannel=sb.channel('msgs-'+orderId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'order_id=eq.'+orderId},(payload)=>{
      const m=payload.new;
      if(!m)return;
      // only if this thread is still the open one
      if(store.threadOrderId!==orderId)return;
      // avoid duplicates (my own just-sent message may already be in the list)
      if((store.threadMsgs||[]).some(x=>x.id===m.id))return;
      store.threadMsgs=[...(store.threadMsgs||[]),m];
      // if it's addressed to me, mark read
      if(m.recipient_id===store.account.uid){try{sb.from('messages').update({read:true}).eq('id',m.id);}catch(e){}}
      render();
    })
    .subscribe();
}
async function openThread(orderId){
  store.threadOrderId=orderId;
  store.threadMsgs=[];
  store.threadLoaded=false;
  render();
  await loadThread(orderId);

}

  if(!sb)return;
  try{const {data}=await sb.from('messages').select('*').eq('order_id',orderId).order('created_at',{ascending:true});store.threadMsgs=data||[];}catch(e){store.threadMsgs=[];}

  render();
}
function closeThread(){ unsubscribeThread(); store.threadOrderId=null; store.threadMsgs=[]; store.threadLoaded=false; render(); }
// figure out who the recipient is for a message, given the order and who I am
function threadRecipient(order){
  const me=store.account.uid;
  // If I'm the contractor: route by where the order is in its life.
  // Once it's been sent to a supplier, I'm talking to the supplier.
  // Before that (during approval), I'm talking to the manager/approver.
  if(order.contractor_id===me){
    if((order.status==='sent'||order.status==='actioned') && order.supplier_id) return order.supplier_id;
    return order.approver_id||order.supplier_id||null;
  }
  // if I'm the manager/approver, send to the contractor
  if(order.approver_id===me){ return order.contractor_id; }
  // if I'm the supplier, send to the contractor
  if(order.supplier_id===me){ return order.contractor_id; }
  // fallback: contractor
  return order.contractor_id;
}
async function sendMessage(orderId){
  const input=document.getElementById('msgInput');
  if(!input)return;
  const body=input.value.trim();
  if(!body)return;
  const order=(store.myOrders||[]).find(o=>o.id===orderId)||(store.approvals||[]).find(o=>o.id===orderId)||(store.incoming||[]).find(o=>o.id===orderId);
  if(!order){alert('Order not found.');return;}
  const recipient=threadRecipient(order);
  const row={ order_id:orderId, sender_id:store.account.uid, sender_name:store.account.name||store.account.email, recipient_id:recipient||store.account.uid, body, read:false };
  try{
    const {error}=await sb.from('messages').insert(row);
    if(error){alert('Could not send: '+error.message);return;}

async function submitOrderForApproval(lines, total, supplierName){
  if(!sb||!store.account){alert('Not connected.');return;}
  if(!store.account.companyId){alert('Your account has no company set, so there is no manager to approve. Ask your admin to set your company.');return;}
  // find the most recent prior order for this supplier in this project
  const prior=(store.myOrders||[])
    .filter(o=>o.supplier_name===(supplierName||'(multiple)') && o.project_id===_workspaceId)
    .sort((a,b)=>(b.revision||1)-(a.revision||1))[0];
  let revision=1, supersedes=null;
  if(prior){
    if(prior.status==='pending_approval'){
      alert(`This project's order to ${supplierName||'suppliers'} is already pending approval (Revision ${prior.revision||1}). Wait for your manager to act, or it will be confusing to send another version now.`);
      return;
    }
    // prior was approved/rejected/sent — this becomes a new revision.
    if(prior.status==='approved'){
      const ok=confirm(`The previous order (Revision ${prior.revision||1}) was already APPROVED. Submitting a revision will supersede it and need fresh approval. Continue?`);
      if(!ok)return;
    }
    revision=(prior.revision||1)+1;
    supersedes=prior.id;
  }
  // mark which lines are newly added vs the prior revision (by item label + supplier)
  let lineSet=lines;
  if(prior&&Array.isArray(prior.items)){
    const priorKeys=new Set(prior.items.map(it=>`${it.item||it.name||''}|${it.supplier||''}`));
    lineSet=lines.map(l=>({...l, isNew:!priorKeys.has(`${l.item||l.name||''}|${l.supplier||''}`)}));
  }
  // resolve supplier account id by name
  let supplierId=null;
  if(supplierName&&supplierName!=='(multiple)'){
    try{const {data}=await sb.from('supplier_profiles').select('id').eq('supplier_name',supplierName).maybeSingle();if(data)supplierId=data.id;}catch(e){}
  }
  const row={
    contractor_id:store.account.uid, contractor_name:store.account.name, contractor_company:store.account.company,
    company_id:store.account.companyId, supplier_id:supplierId, supplier_name:supplierName||'(multiple)',
    project_id:_workspaceId, project_name:store.projectName||'Untitled project',
    revision, supersedes,
    items:lineSet, total:total, currency:store.currency, status:'pending_approval'
  };
  try{
    const {error}=await sb.from('orders').insert(row);
    if(error){alert('Could not submit: '+error.message);return;}
    alert(revision>1?`✓ Revision ${revision} submitted for approval. New items are highlighted for your manager.`:'✓ Submitted for approval. Your manager will see it when they log in.');
    store.myOrdersLoaded=false; loadMyOrders();
  }catch(e){alert('Could not submit: '+e.message);}
}

function pickOffer(matches, code, thk){
  if(!matches.length) return {price:0, supplier:null, offers:[], pinned:false, fellBack:false};
  const pinned=store.supplierPrefs[prefKey(code,thk)];
  let chosen=null, fellBack=false;
  if(pinned){

  if(!chosen) chosen=[...matches].sort((a,b)=>a.price-b.price)[0];
  return {price:chosen?chosen.price:0, supplier:chosen?chosen.supplier:null, offers:matches, pinned:!!pinned, fellBack};
}

// ---- ASSEMBLY TEMPLATES ----
// Each template takes user inputs and returns a list of {code, qty, desc, unit}.
// Quantities are calculated using industry rules of thumb. All editable.
// Pick a real, stocked bar length for a linear item, since the price book
// only has exact-match prices (code+thickness+length) with no fuzzy fallback.
// Prefers the shortest stock option that's still long enough to cut the
// piece from (least waste); if nothing is long enough, falls back to the
// longest available rather than silently pricing nothing.
function bestLinearLen(code,thk,needed){
  const opts=[...new Set(store.priceBook.linear.filter(x=>x.code===code&&x.thk===thk).map(x=>x.len))];
  if(!opts.length) return needed; // nothing stocked under this code/thickness at all
  const fits=opts.filter(l=>l>=needed).sort((a,b)=>a-b);
  return fits.length ? fits[0] : Math.max(...opts);
}
const ASSEMBLIES = {
  stud_wall: {
    name: 'Stud Partition Wall',
    inputs: [
      {k:'L', label:'Length (m)', def:5},
      {k:'H', label:'Height (m)', def:2.7},
      {k:'spacing', label:'Stud spacing (mm)', def:600},
      {k:'layers', label:'Board layers (e.g. 1+1, 2+2)', def:'1+1', type:'select', opts:['1+0','1+1','2+1','2+2']},
      {k:'studCode', label:'Stud code', def:'STUD-92', type:'text'},
      {k:'studThk', label:'Stud thk (mm)', def:92},
      {k:'trackCode', label:'Track code', def:'TRK-92', type:'text'},
      {k:'boardCode', label:'Board code', def:'GYP', type:'text'},
      {k:'boardThk', label:'Board thk (mm)', def:12.5},
      {k:'insulCode', label:'Insulation code', def:'INSUL-100MM', type:'text'},
      {k:'externalCorners', label:'External corners', def:0},
    ],
    compute(p){
      const L=+p.L, H=+p.H, spacing=+p.spacing/1000;
      const layersArr=String(p.layers||'1+1').split('+').map(n=>+n);
      const layersTotal=layersArr.reduce((a,b)=>a+b,0); // 1+1=2 layers, 2+2=4
      const studs=Math.ceil(L/spacing)+1;
      // Studs are cut down from a stock bar, so price against a real stocked
      // length long enough for the wall height — not the exact cut height,
      // which will essentially never match a catalogue length.
      const studNeeded=Math.ceil(H*1000); // mm, the actual cut length
      const studStockLen=bestLinearLen(p.studCode,+p.studThk,studNeeded);
      // Track is laid end-to-end along the wall run (top + bottom), so what
      // matters is the total run length, covered by however many stock bars
      // that takes — prefer the longest stocked option to minimise joints.
      const trackRunNeeded=L*1.05*1000*2; // top + bottom, mm, 5% wastage

// Cost an assembly row's BoM, returning [{line, supplier, cost}]
function assemblyCost(row){
  const tpl=ASSEMBLIES[row.type]; if(!tpl) return {items:[], total:0};
  const items=tpl.compute(row.params).map(it=>{
    let price=0, supplier='—';
    if(it.kind==='linear'){const o=offerLinear(it.code,it.thk,it.len);price=o.price;supplier=o.supplier||'—';}
    else if(it.kind==='sheet'){const o=offerSheet(it.code,it.thk,it.w,it.h);price=o.price;supplier=o.supplier||'—';}
    else if(it.kind==='anc'){const o=offerAncillary(it.code);price=o.price;supplier=o.supplier||'—';if(!it.unit){it.unit=ancMeta(it.code).unit;}}
    return {...it, price, supplier, cost:price*it.qty};
  });
  return {items, total:items.reduce((s,i)=>s+i.cost,0)};
}

// all known codes across the price book, for the custom-assembly picker
function allKnownItems(){
  const out=[];
  (store.priceBook.ancillary||[]).forEach(e=>out.push({code:e.code,desc:e.desc,unit:e.unit,price:e.price,supplier:e.supplier}));
  store.priceBook.linear.forEach(e=>out.push({code:e.code,desc:e.code+' '+e.thk+'mm @ '+e.len,unit:'length',price:e.price,supplier:e.supplier}));
  store.priceBook.sheet.forEach(e=>out.push({code:e.code,desc:e.code+' '+e.thk+'mm '+e.w+'x'+e.h,unit:'sheet',price:e.price,supplier:e.supplier}));
  store.priceBook.paint.forEach(e=>out.push({code:e.code,desc:e.code+' (paint)',unit:'L',price:e.price,supplier:e.supplier}));
  // de-dup by code
  const seen={};return out.filter(i=>{if(seen[i.code])return false;seen[i.code]=1;return true;});
}
// cost a custom assembly: each line is {name, code, qty, unit, price}
// if a code matches the price book, pull its live price+supplier; else use the typed price
function customCost(ca){
  const items=(ca.lines||[]).map(ln=>{
    let price=+ln.price||0, supplier=ln.supplier||'(manual)';
    if(ln.code){const o=offerAncillary(ln.code);if(o.price>0){price=o.price;supplier=o.supplier||supplier;}
      else{const k=allKnownItems().find(i=>i.code===ln.code);if(k){price=k.price;supplier=k.supplier||supplier;}}}
    return {...ln, price, supplier, cost:price*(+ln.qty||0)};
  });
  return {items, total:items.reduce((s,i)=>s+i.cost,0)};
}
function optimiseLinear(stockLen,kerf,cuts){
  const pieces=[];cuts.forEach(c=>{for(let i=0;i<c.qty;i++)pieces.push({len:c.len});});
  pieces.sort((a,b)=>b.len-a.len);
  const bars=[];let fresh=0;
  pieces.forEach(p=>{let placed=false;
    for(const bar of bars){const need=p.len+(bar.cuts.length?kerf:0);if(bar.remaining>=need){bar.cuts.push(p);bar.remaining-=need;placed=true;break;}}
    if(!placed){bars.push({cuts:[p],remaining:stockLen-p.len,capacity:stockLen});fresh++;}});
  const used=bars.filter(b=>b.cuts.length);
  const totalStock=fresh*stockLen, totalUsed=pieces.reduce((s,p)=>s+p.len,0);
  const kerfTotal=used.reduce((s,b)=>s+Math.max(0,b.cuts.length-1)*kerf,0);
  const wastePct=totalStock>0?Math.max(0,totalStock-totalUsed-kerfTotal)/totalStock*100:0;
  const newDrops=used.filter(b=>b.remaining>0).map(b=>Math.round(b.remaining));
  return {bars:used,barCount:fresh,wastePct,newDrops};
}

// ---- guillotine sheet packer ----
function packGuillotine(sheetW,sheetH,kerf,parts){
  // each part may carry rot:true meaning it can be rotated 90° for best fit (no-grain)
  const sorted=[...parts].sort((a,b)=>(b.w*b.h)-(a.w*a.h));
  const sheets=[];
  const newSheet=()=>({free:[{x:0,y:0,w:sheetW,h:sheetH}],placed:[]});
  // find the best free rectangle for a piece at a given w/h; returns {idx,score} or null
  function bestFit(sheet,w,h){
    let best=-1,bestScore=Infinity;
    for(let i=0;i<sheet.free.length;i++){const f=sheet.free[i];
      if(w<=f.w&&h<=f.h){const sc=Math.min(f.w-w,f.h-h);if(sc<bestScore){bestScore=sc;best=i;}}}
    return best<0?null:{idx:best,score:bestScore};
  }
  function tryPlace(sheet,p){
    // option A: as-is
    let chosen={w:p.w,h:p.h,fit:bestFit(sheet,p.w,p.h)};
    // option B: rotated 90° (only if allowed and not square)
    if(p.rot && p.w!==p.h){
      const fitR=bestFit(sheet,p.h,p.w);
      if(fitR && (!chosen.fit || fitR.score<chosen.fit.score)){
        chosen={w:p.h,h:p.w,fit:fitR};
      }
    }
    if(!chosen.fit)return false;
    const f=sheet.free[chosen.fit.idx];
    sheet.placed.push({w:chosen.w,h:chosen.h,x:f.x,y:f.y,ref:p.ref,label:p.label,code:p.code,item:p.item,grainless:!!p.grainless});
    const rW=f.w-chosen.w-kerf,bH=f.h-chosen.h-kerf;
    sheet.free.splice(chosen.fit.idx,1);
    if(rW>0)sheet.free.push({x:f.x+chosen.w+kerf,y:f.y,w:rW,h:chosen.h});
    if(bH>0)sheet.free.push({x:f.x,y:f.y+chosen.h+kerf,w:f.w,h:bH});
    return true;
  }
  sorted.forEach(p=>{let placed=false;for(const s of sheets){if(tryPlace(s,p)){placed=true;break;}}if(!placed){const s=newSheet();tryPlace(s,p);sheets.push(s);}});
  const usedArea=sorted.reduce((s,p)=>s+p.w*p.h,0),total=sheets.length*sheetW*sheetH;
  return {sheets:sheets.map(s=>({parts:s.placed,free:s.free})),sheetCount:sheets.length,wastePct:total>0?(total-usedArea)/total*100:0};
}
function optimiseSheets(sheetW,sheetH,kerf,grain,parts){
  const items=[];
  parts.forEach((p,pi)=>{
    // build a per-row reference once; number the copies within the row
    for(let i=0;i<p.qty;i++){
      const baseRef=(typeof pieceRef==='function')?pieceRef(p,pi):'';
      const ref=baseRef+' · '+(i+1)+' of '+p.qty;
      const item=(typeof itemName==='function')?itemName(p):'';
      items.push({w:p.cw,h:p.ch,ref:ref,label:p.label||'',code:p.code||'',item:item});
    }
  });
  const orient=it=>{
    if(grain==='across')return {w:it.h,h:it.w,rot:false,ref:it.ref,label:it.label,code:it.code,item:it.item};
    if(grain==='none')return {w:it.w,h:it.h,rot:true,grainless:true,ref:it.ref,label:it.label,code:it.code,item:it.item};
    return {w:it.w,h:it.h,rot:false,ref:it.ref,label:it.label,code:it.code,item:it.item};
  };
  let mapped=items.map(orient);

  // ---- Stage 2: reuse banked sheet offcuts first (by code + thickness) ----
  let offcutSheets=[]; let offcutsUsed=0;
  if(store.reuseSheetOffcuts){
    const code=(store.sheetCode||'').toUpperCase(), thk=+store.sheetThk||0;
    // matching banked sheet offcuts, biggest first
    const banks=(store.bankedDrops||[]).filter(d=>d.kind==='sheet' && (d.code||'').toUpperCase()===code && (+d.thk||0)===thk && d.w>0 && d.h>0)
      .sort((a,b)=>(b.w*b.h)-(a.w*a.h));
    for(const b of banks){
      if(!mapped.length)break;
      // try to pack remaining pieces onto this single offcut "board"
      const r=packGuillotine(b.w,b.h,kerf,mapped);
      // keep only the FIRST offcut-board worth of placements, return the rest to the pool
      if(r.sheets.length && r.sheets[0].parts.length){
        const placed=r.sheets[0].parts;
        offcutSheets.push({parts:placed,fromOffcut:true,offcutW:b.w,offcutH:b.h});
        offcutsUsed++;
        // remove the placed pieces from mapped (match by ref, which is unique per piece)
        const placedRefs={}; placed.forEach(p=>{placedRefs[p.ref]=(placedRefs[p.ref]||0)+1;});
        const remain=[];
        mapped.forEach(m=>{ if(placedRefs[m.ref]>0){placedRefs[m.ref]--;} else remain.push(m); });
        mapped=remain;
      }
    }
  }

  // ---- remaining pieces go onto fresh full boards ----
  const fresh=packGuillotine(sheetW,sheetH,kerf,mapped);
  // combine: offcut boards first, then fresh boards
  const allSheets=offcutSheets.concat(fresh.sheets);
  // waste % is measured against FRESH boards only (offcuts were "free" leftovers)
  return {sheets:allSheets, sheetCount:fresh.sheetCount, offcutsUsed, wastePct:fresh.wastePct};
}
const sheetWaste=(w,h,k,g,p)=>optimiseSheets(w,h,k,g,p).wastePct;

// Auto-bank usable leftover offcuts from the current sheet job.
// Replaces (not duplicates) this job's auto entries each time. Match key: code+thk.
const OFFCUT_MIN=200; // ignore scraps smaller than this (mm) on the long side
function autoBankSheetOffcuts(res){
  if(!store.bankedDrops)store.bankedDrops=[];
  const code=store.sheetCode||'', thk=store.sheetThk||0;
  const grainTxt=store.grain==='along'?'Along':store.grain==='across'?'Across':'None';
  // remove previous auto entries for THIS job signature (code+thk), keep manual & other jobs
  const sig='auto:'+code+':'+thk;
  store.bankedDrops=store.bankedDrops.filter(d=>d._auto!==sig);
  if(!res||!res.sheets||!res.sheets.length)return;
  // collect usable free rectangles across sheets
  const offs=[];
  res.sheets.forEach(s=>{(s.free||[]).forEach(f=>{
    const lng=Math.max(f.w,f.h), shrt=Math.min(f.w,f.h);
    if(lng>=OFFCUT_MIN && shrt>=OFFCUT_MIN){ offs.push({w:Math.round(f.w),h:Math.round(f.h)}); }
  });});
  // add them tagged with the job signature
  const today=new Date().toLocaleDateString();
  offs.forEach((o,i)=>{
    store.bankedDrops.push({id:Date.now()+i, _auto:sig, kind:'sheet', code, thk,
      material:store.sheetCode||'Sheet', w:o.w, h:o.h, grain:grainTxt, finish:'',
      size:Math.max(o.w,o.h), zone:'Auto (from cut)', date:today});
  });
}

// lip on an edge reduces the perpendicular dimension; perimeter trim adds oversize on all 4 edges
// site-fit check: does the finished panel fit the site opening?
// uses the panel's own siteW/siteH/siteD, OR the zone's site limit if set.
// note: depth is stored and shown for reference (matches the site engineer's
// W×H×D measurement) but isn't fit-checked — a flat panel's own W×H doesn't map
// to a single "depth" dimension the way a 3D site opening does.
function siteLimitFor(r){
  let sw=+r.siteW||0, sh=+r.siteH||0, sd=+r.siteD||0;
  const zl=(store.zoneSiteLimits||{})[r.zone];
  if(zl){ if(!sw&&zl.w)sw=zl.w; if(!sh&&zl.h)sh=zl.h; if(!sd&&zl.d)sd=zl.d; }
  return {sw,sh,sd};
}
function fitIndicator(r){
  const {sw,sh,sd}=siteLimitFor(r);
  if(!sw&&!sh&&!sd)return '<span style="color:var(--mut);font-size:10px">—</span>';
  const tol=+store.siteTol||0; // optional clearance: item should be this much smaller
  const overW = sw>0 && (r.w > sw - tol);
  const overH = sh>0 && (r.h > sh - tol);
  if(overW||overH){
    const msgs=[];
    if(overW)msgs.push(`W ${fmt(r.w)}>${fmt(sw)}`);
    if(overH)msgs.push(`H ${fmt(r.h)}>${fmt(sh)}`);
    return `<span style="color:#fff;background:var(--red);padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;white-space:nowrap" title="Item exceeds site space">⚠ ${msgs.join(' · ')}</span>`;
  }
  return '<span style="color:var(--green);font-size:11px;font-weight:700" title="Fits the site space">✓ fits</span>';
}
function cutSize(r){const t=r.lip||0,e=r.edge||'0';let dw=0,dh=0;
  if(e==='1w')dh=t;else if(e==='2w')dh=2*t;else if(e==='1h')dw=t;else if(e==='2h')dw=2*t;else if(e==='all'){dw=2*t;dh=2*t;}
  const trim=Math.max(0,+store.sheetTrim||0); // cleaning trim on every edge -> +2*trim each way
  return {cw:Math.max(0,r.w-dw)+2*trim,ch:Math.max(0,r.h-dh)+2*trim};}

// ---- lipping length (mm) per panel based on lipped edges ----
// A "width edge" runs along the W side (horizontal, top/bottom) so its length = W.
// A "height edge" runs along the H side (vertical, left/right) so its length = H.
function lipLenPerPanel(r){
  const e=r.edge||'0';
  if(e==='1w')return r.w;
  if(e==='2w')return 2*r.w;
  if(e==='1h')return r.h;
  if(e==='2h')return 2*r.h;
  if(e==='all')return 2*r.w+2*r.h;
  return 0;
}
// Aggregate lipping demand across panel rows -> [{code, thk, stockLen, totalMM, withWasteMM, lengthsToBuy, supplier, unitPrice, cost}]
function lipDemand(rows){
  const buckets={};
  rows.forEach(r=>{
    if(!r.lipCode||!r.lip||!r.edge||r.edge==='0')return;
    const stockLen=+r.lipLen||3600;
    const k=r.lipCode+'|'+r.lip+'|'+stockLen;
    if(!buckets[k])buckets[k]={code:r.lipCode,thk:r.lip,stockLen,totalMM:0};
    buckets[k].totalMM+=lipLenPerPanel(r)*r.qty;
  });
  const wastePct=(+store.lipWaste||0)/100;
  return Object.values(buckets).map(b=>{
    const withWasteMM=b.totalMM*(1+wastePct);
    const lengthsToBuy=Math.ceil(withWasteMM/b.stockLen);
    const off=offerLinear(b.code,b.thk,b.stockLen);
    return {...b, withWasteMM, lengthsToBuy, supplier:off.supplier||'—', unitPrice:off.price, cost:lengthsToBuy*off.price, fellBack:off.fellBack};
  });
}

// ---- paint: litres + cost ----
// per-piece sheet finish areas (m²) split by primer vs paint, based on pfinish choice
function sheetFinishArea(){
  let primeM2=0, paintM2=0;
  const rows=store.zoneFilter==='all'?store.sheetRows:store.sheetRows.filter(r=>r.zone===+store.zoneFilter);
  rows.forEach(r=>{
    const fin=r.pfinish||'none'; if(fin==='none')return;
    const faces=Math.max(1,+r.paintFaces||1);
    const oneFace=(r.w||0)*(r.h||0)/1e6;
    const baseArea=oneFace*faces*(r.qty||0);
    if(fin==='prime'||fin==='both'){ primeM2 += baseArea*(store.primerCoats||1); }
    if(fin==='paint'||fin==='both'){ paintM2 += baseArea*(store.paintCoats||2); }
  });
  return {primeM2, paintM2};
}
function sheetPrimerCalc(){
  const {primeM2}=sheetFinishArea();
  const spread=store.primerSpread||10, waste=(store.primerWaste||10)/100;
  const litres=spread>0?(primeM2/spread)*(1+waste):0;
  const o=offerPaint(store.primerCode||'PRIMER-WHT');
  return {area:primeM2, litres, cost:litres*o.price, supplier:o.supplier, price:o.price};
}
function sheetPaintCalc(){
  const {paintM2}=sheetFinishArea();
  const spread=store.sheetPaintSpread||11, waste=(store.sheetPaintWaste||10)/100;
  const litres=spread>0?(paintM2/spread)*(1+waste):0;
  const o=offerPaint(store.sheetPaintCode||'PNT-WHT-MATT');
  return {area:paintM2, litres, cost:litres*o.price, supplier:o.supplier, price:o.price};
}
// ---- auto-accessories: count parts across sheet panels, generate hardware ----
function sheetAccessories(){
  const R=store.accRules||{};
  const rows=store.zoneFilter==='all'?store.sheetRows:store.sheetRows.filter(r=>r.zone===+store.zoneFilter);
  const acc={}; // code -> qty
  const add=(code,n)=>{if(!code||n<=0)return;acc[code]=(acc[code]||0)+n;};
  const C=store.accCodes||{};
  // Part names are user-extensible (custom types, free-typed via "Other"), so
  // matching them exactly and case-sensitively silently drops accessories the
  // moment anyone types "door" instead of "Door" — proven to happen in testing.
  // Normalise both sides so the same word in a different case still matches.
  const norm=s=>String(s||'').trim().toLowerCase();
  const carcass=(R.carcassParts||['Side','Top','Bottom','Back']).map(norm);
  const unmatched={}; // part name -> total qty that triggered no rule at all
  rows.forEach(r=>{
    const part=r.part||''; const partN=norm(part); const qty=Math.max(0,+r.qty||0); if(!part||qty<=0)return;
    if(partN==='door'){
      // hinges scale by door height (use final H)
      const h=+r.h||0; const band=(R.hingeBands||[]).find(b=>h<=b.max)||{n:2};
      add(C.hinge, band.n*qty);
      add(C.handle,(R.handlesPerDoor||1)*qty);
    } else if(partN==='shelf'){
      add(C.pin,(R.shelfPins||4)*qty);
    } else if(partN==='drawer front'){
      add(C.runner,(R.runnerPairs||1)*qty);
      add(C.handle,(R.handlesPerDrawer||1)*qty);
    } else if(carcass.includes(partN)){
      add(C.dowel,(R.dowelsPerCarcass||4)*qty);
      add(C.screw,(R.screwsPerCarcass||4)*qty);
    } else {
      // Nothing matched. This is worth surfacing rather than silently
      // producing zero accessories for a real, counted part — a part named
      // "Cabinet Door" instead of "Door" would otherwise vanish with no trace.
      unmatched[part]=(unmatched[part]||0)+qty;
    }
  });
  store._accUnmatched=Object.entries(unmatched).map(([part,qty])=>({part,qty}));
  // turn into rows with the CHOSEN (or default) brand/model priced from catalogue
  return Object.entries(acc).map(([code,qty])=>{
    const o=chosenAccessory(code);
    return {code, qty, supplier:o.supplier, desc:o.desc, price:o.price, cost:o.price*qty, options:accessoryOptions(code)};
  }).filter(a=>a.qty>0);
}
// find a price for an accessory code from the price book / catalogue (best/cheapest)
function offerAccessory(code){
  let best=null;
  (store.catalogueAll||[]).forEach(c=>{if((c.code||'').toUpperCase()===code.toUpperCase()&&c.price>0){if(!best||c.price<best.price)best={price:c.price,supplier:c.supplier_name};}});
  (store.myCatalogue||[]).forEach(c=>{if((c.code||'').toUpperCase()===code.toUpperCase()&&c.price>0){if(!best||c.price<best.price)best={price:c.price,supplier:'You'};}});
  return best||{price:0,supplier:null};
}
// list every catalogue item (any supplier, or the contractor's own price book) that could
// serve as this accessory code — lets the person pick a specific brand/model, not just
// whichever is cheapest.
function accessoryOptions(code){
  const opts=[];
  (store.catalogueAll||[]).forEach(c=>{if((c.code||'').toUpperCase()===code.toUpperCase()&&c.price>0){opts.push({id:'cat:'+c.id,price:c.price,supplier:c.supplier_name,desc:c.description||c.code,currency:c.currency||store.currency});}});
  (store.myCatalogue||[]).forEach(c=>{if((c.code||'').toUpperCase()===code.toUpperCase()&&c.price>0){opts.push({id:'mine:'+c.id,price:c.price,supplier:'You',desc:c.description||c.code,currency:c.currency||store.currency});}});
  opts.sort((a,b)=>a.price-b.price);
  return opts;
}
// the chosen (or default-cheapest) accessory option for a given code
function chosenAccessory(code){
  const opts=accessoryOptions(code);
  if(!opts.length)return {price:0,supplier:null,desc:null,id:null};
  const savedId=(store.accSelections||{})[code];
  const found=savedId?opts.find(o=>o.id===savedId):null;
  return found||opts[0];
}
function paintCalc(r){
  const area=r.area||0, coats=r.coats||1, spread=r.spread||10, waste=(r.waste||0)/100;
  const litres=spread>0?(area*coats/spread)*(1+waste):0;
  const o=offerPaint(r.code);
  return {litres, cost:litres*o.price, supplier:o.supplier, pinned:o.pinned, fellBack:o.fellBack, offers:o.offers};
}

    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const sheetName=wb.SheetNames.find(n=>n.toLowerCase()==='items')||wb.SheetNames[0];
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
      if(!raw.length){alert('That sheet looks empty.');return;}
      const norm=s=>String(s||'').toLowerCase().replace('▾','').trim();
      const headerRow=raw[0].map(norm);
      const col=(...names)=>{for(const n of names){const i=headerRow.indexOf(n);if(i>=0)return i;}return -1;};
      const idx={
        project:col('project'), zone:col('zone'), desc:col('item / description','item','description'),
        qty:col('qty'), assignee:col('assignee'), stage:col('f'), flag:col('flag'), note:col('status'),
        drawing:col('drawing date'), sample:col('sample approved date'), started:col('started date'),
        machinery:col('machinery date'), assembly:col('assembly date'), painting:col('painting date'),
        delivery:col('delivery date'), site:col('site date')
      };
      const toDateStr=v=>{if(!v)return null; const d=(v instanceof Date)?v:new Date(v); return isNaN(d)?null:d.toISOString().slice(0,10);};
      const rows=raw.slice(1).filter(r=>r.some(c=>c!=='')).map(r=>{
        let stage=String(idx.stage>=0?r[idx.stage]:'').trim();
        if(!PROD_STAGES.includes(stage))stage=PROD_STAGES.find(s=>s.toLowerCase()===stage.toLowerCase())||'Not Started';
        let flag=String(idx.flag>=0?r[idx.flag]:'').trim()||'—';
        if(!PROD_FLAGS.includes(flag))flag='—';
        return {
          company_id:store.account.companyId, created_by:store.account.uid,
          project_name:idx.project>=0?String(r[idx.project]||''):'', zone_name:idx.zone>=0?String(r[idx.zone]||''):'',
          description:idx.desc>=0?String(r[idx.desc]||''):'', qty:Math.max(1,Math.round(+(idx.qty>=0?r[idx.qty]:1)||1)),
          assignee:(idx.assignee>=0?String(r[idx.assignee]||''):'')||'Unassigned', flag, stage,
          status_note:idx.note>=0?String(r[idx.note]||''):'',
          drawing_date:toDateStr(idx.drawing>=0?r[idx.drawing]:null), sample_approved_date:toDateStr(idx.sample>=0?r[idx.sample]:null),
          started_date:toDateStr(idx.started>=0?r[idx.started]:null), machinery_date:toDateStr(idx.machinery>=0?r[idx.machinery]:null),
          assembly_date:toDateStr(idx.assembly>=0?r[idx.assembly]:null), painting_date:toDateStr(idx.painting>=0?r[idx.painting]:null),
          delivery_date:toDateStr(idx.delivery>=0?r[idx.delivery]:null), site_date:toDateStr(idx.site>=0?r[idx.site]:null),
        };
      }).filter(r=>r.project_name||r.description);
      if(!rows.length){alert('No usable rows found — check this is your Items sheet.');return;}
      if(!confirm(`Import found ${rows.length} items. They'll be ADDED to your existing production list (not replacing it). Continue?`))return;
      let ok=0, failed=0;
      for(let i=0;i<rows.length;i+=200){
        const batch=rows.slice(i,i+200);
        try{await sb.from('production_items').insert(batch); ok+=batch.length;}
        catch(ex){failed+=batch.length;}
      }
      await loadProductionItems();
      alert(`Import complete: ${ok} added${failed?`, ${failed} failed`:''}.`);
    }catch(ex){alert('Could not read that file: '+(ex.message||'unknown error'));}
  };
  reader.readAsArrayBuffer(file);
}
function wireMarkupOverlay(){
  document.querySelectorAll('[data-markup]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const [target,encUrl]=b.dataset.markup.split('|');
    openMarkup(target,decodeURIComponent(encUrl));
  });
  document.querySelectorAll('[data-marktool]').forEach(b=>b.onclick=()=>{store.markupTool=b.dataset.marktool;render();});
  document.querySelectorAll('[data-markcolor]').forEach(b=>b.onclick=()=>{store.markupColor=b.dataset.markcolor;render();});
  const mUndo=document.getElementById('markUndo');if(mUndo)mUndo.onclick=()=>{(store.markupStrokes||[]).pop();drawMarkupCanvas();};
  const mClear=document.getElementById('markClear');if(mClear)mClear.onclick=()=>{if(confirm('Clear all markup on this page?')){store.markupStrokes=[];drawMarkupCanvas();}};
  const mCancel=document.getElementById('markCancel');if(mCancel)mCancel.onclick=()=>{store.markupTarget=null;render();};
  const mSave=document.getElementById('markSave');if(mSave)mSave.onclick=()=>saveMarkup();
  const mcv=document.getElementById('markupCanvas');
  if(mcv){
    drawMarkupCanvas();
    const pos=(e)=>{const r=mcv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return {x:(p.clientX-r.left)*(mcv.width/r.width),y:(p.clientY-r.top)*(mcv.height/r.height)};};
    let drawing=false, cur=null;
    const start=(e)=>{
      e.preventDefault(); const p=pos(e);
      if(store.markupTool==='text'){
        const t=prompt('Text to add:'); if(t&&t.trim()){(store.markupStrokes||(store.markupStrokes=[])).push({type:'text',color:store.markupColor,x:p.x,y:p.y,text:t.trim()});drawMarkupCanvas();}
        return;
      }
      drawing=true;
      if(store.markupTool==='pen')cur={type:'pen',color:store.markupColor,points:[p]};
      else cur={type:'line',color:store.markupColor,x1:p.x,y1:p.y,x2:p.x,y2:p.y};
    };
    const move=(e)=>{
      if(!drawing)return; e.preventDefault(); const p=pos(e);
      if(cur.type==='pen')cur.points.push(p); else {cur.x2=p.x;cur.y2=p.y;}
      drawMarkupCanvas(); const ctx=mcv.getContext('2d'); drawStroke(ctx,cur);
    };
    const end=(e)=>{
      if(!drawing)return; drawing=false;
      (store.markupStrokes||(store.markupStrokes=[])).push(cur); cur=null; drawMarkupCanvas();
    };
    mcv.onmousedown=start; mcv.onmousemove=move; mcv.onmouseup=end; mcv.onmouseleave=end;
    mcv.ontouchstart=start; mcv.ontouchmove=move; mcv.ontouchend=end;
  }
}

async function saveReviewRequest(){
  const rd=store.reqDraft||{};
  if(!(rd.project_name||'').trim()){store.reqMsg='Please enter a project name.';store.reqErr=true;render();return;}
  if(!rd.fileUrl){store.reqMsg='Please attach a drawing first.';store.reqErr=true;render();return;}
  store.reqBusy=true;store.reqMsg='';store.reqErr=false;render();
  const row={
    company_id:store.account.companyId, site_engineer_id:store.account.uid, site_engineer_name:'Unassigned',
    project_name:(rd.project_name||'').trim(), location_name:(rd.location_name||'').trim(),
    notes:(rd.note||'').trim(), status:'open',
    factory_attachments:[{url:rd.fileUrl, note:(rd.note||'').trim(), sent_by:store.account.name||store.account.email, sent_at:new Date().toISOString(), status:'pending'}]
  };
  try{
    const {data,error}=await sb.from('site_visits').insert(row).select().single();
    if(error)throw error;
    store.siteVisits=[data,...(store.siteVisits||[])];
    store.reqDraft={}; store.reqMsg='Sent for review.'; store.reqErr=false;
  }catch(e){store.reqMsg='Could not send: '+(e.message||'error');store.reqErr=true;}
  store.reqBusy=false; render();
}

// ---- Stage D rollups: by Project, by Project▸Zone, by Team — same aggregation
// logic as the Excel's Projects / Project▸Zone / Team sheets ----
function prodByProject(items){
  const map={};
  items.forEach(it=>{
    const key=it.project_name||'(no project)';
    if(!map[key])map[key]={project:key,qty:0,progressSum:0,progressCount:0,aging:0};
    const c=prodItemCalc(it); const qty=+it.qty||0;
    map[key].qty+=qty; map[key].progressSum+=c.progress; map[key].progressCount++;
    if(c.aging==='Aging')map[key].aging+=qty;
  });
  return Object.values(map).map(p=>({...p,avgProgress:p.progressCount?p.progressSum/p.progressCount:0}))
    .sort((a,b)=>a.project.localeCompare(b.project));
}
function prodByProjectZone(items){
  const projects={};
  items.forEach(it=>{
    const pk=it.project_name||'(no project)', zk=it.zone_name||'(no zone)';
    if(!projects[pk])projects[pk]={project:pk,qty:0,progressSum:0,progressCount:0,zones:{}};
    const c=prodItemCalc(it); const qty=+it.qty||0;
    projects[pk].qty+=qty; projects[pk].progressSum+=c.progress; projects[pk].progressCount++;
    if(!projects[pk].zones[zk])projects[pk].zones[zk]={zone:zk,qty:0,progressSum:0,progressCount:0,stages:{}};
    const z=projects[pk].zones[zk];
    z.qty+=qty; z.progressSum+=c.progress; z.progressCount++;
    z.stages[it.stage]=(z.stages[it.stage]||0)+qty;
  });
  return Object.values(projects).map(p=>({...p,avgProgress:p.progressCount?p.progressSum/p.progressCount:0,
    zones:Object.values(p.zones).map(z=>({...z,avgProgress:z.progressCount?z.progressSum/z.progressCount:0}))
      .sort((a,b)=>a.zone.localeCompare(b.zone))}))
    .sort((a,b)=>a.project.localeCompare(b.project));
}
function prodByTeam(items){
  const map={};
  items.forEach(it=>{
    const key=it.assignee||'Unassigned';
    if(!map[key])map[key]={person:key,qty:0,inProduction:0,onSite:0};
    const qty=+it.qty||0;
    map[key].qty+=qty;
    if(it.stage==='Site')map[key].onSite+=qty;
    else if(it.stage!=='Not Started')map[key].inProduction+=qty;
  });
  return Object.values(map).sort((a,b)=>b.qty-a.qty);
}
// ---- Dashboard: filters + KPIs, matching the Excel Dashboard sheet's formulas ----
function prodFilteredItems(items){
  const f=store.dashFilter||{};
  return items.filter(it=>
    (!f.project||f.project==='(All)'||it.project_name===f.project) &&
    (!f.assignee||f.assignee==='(All)'||it.assignee===f.assignee) &&
    (!f.zone||f.zone==='(All)'||it.zone_name===f.zone)
  );
}
// chart.js instances for the dashboard — must be tracked outside `store` (not data,
// just DOM/canvas bindings) so we can destroy+recreate them cleanly on every re-render.
let _prodCharts={status:null,release:null};
function renderProdCharts(items){
  if(typeof Chart==='undefined')return; // CDN not loaded yet — skip quietly
  const c=prodDashboardCalc(items);
  const sc=document.getElementById('statusChart');
  if(sc){
    if(_prodCharts.status)_prodCharts.status.destroy();
    _prodCharts.status=new Chart(sc,{type:'doughnut',
      data:{labels:['On site','In progress','Not started'],datasets:[{data:[c.onSiteQty,c.inProgQty,c.notStartedQty],backgroundColor:['#3ddc84','#FFB300','#5c636b'],borderColor:'#1c1f24',borderWidth:2}]},
      options:{plugins:{legend:{display:false}},cutout:'62%',responsive:true,maintainAspectRatio:false}
    });
  }
  const rc=document.getElementById('releaseChart');
  if(rc){
    if(_prodCharts.release)_prodCharts.release.destroy();
    _prodCharts.release=new Chart(rc,{type:'bar',
      data:{labels:PROD_STAGES,datasets:[{data:PROD_STAGES.map(s=>c.byRelease[s]||0),backgroundColor:'#5db8ff'}]},
      options:{plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false,
        scales:{x:{ticks:{color:'#9aa3ad',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#9aa3ad'},grid:{color:'#2a2f37'}}}}
    });
  }
}
function prodDashboardCalc(items){
  const filtered=prodFilteredItems(items);
  const qty=filtered.reduce((s,it)=>s+(+it.qty||0),0);
  const onSiteQty=filtered.filter(it=>it.stage==='Site').reduce((s,it)=>s+(+it.qty||0),0);
  const notStartedQty=filtered.filter(it=>it.stage==='Not Started').reduce((s,it)=>s+(+it.qty||0),0);
  const inProgQty=qty-onSiteQty-notStartedQty;
  const agingQty=filtered.filter(it=>prodItemCalc(it).aging==='Aging').reduce((s,it)=>s+(+it.qty||0),0);
  const avgProgress=filtered.length?filtered.reduce((s,it)=>s+prodItemCalc(it).progress,0)/filtered.length:0;
  const byRelease={}; PROD_STAGES.forEach(s=>byRelease[s]=0);
  filtered.forEach(it=>{byRelease[it.stage]=(byRelease[it.stage]||0)+(+it.qty||0);});
  return {filtered,qty,onSiteQty,notStartedQty,inProgQty,agingQty,avgProgress,byRelease,pctOnSite:qty?onSiteQty/qty:0};
}

      <label class="field" style="flex:1;min-width:140px"><span class="fl">▾ ZONE / FLOOR</span><select class="fi" id="dash_zone">${zones.map(z=>`<option value="${z}" ${z===f.zone?'selected':''}>${z}</option>`).join('')}</select></label>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;padding:0 12px 12px">
      <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:22px">${c.qty}</div><div class="sl">ITEMS (QTY)</div></div>
      <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:22px;color:var(--green)">${Math.round(c.pctOnSite*100)}%</div><div class="sl">% ON SITE</div></div>
      <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:22px;color:${c.agingQty?'var(--red)':'var(--mut)'}">${c.agingQty}</div><div class="sl">AGING (QTY)</div></div>
      <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:22px;color:var(--amber)">${Math.round(c.avgProgress*100)}%</div><div class="sl">AVG PROGRESS</div></div>
    </div>
  </div>
  <div class="card">
    <div class="cardHead"><span>📦 ITEMS STATUS (selected slice)</span></div>
    <div style="padding:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <div style="width:180px;height:180px;flex-shrink:0"><canvas id="statusChart"></canvas></div>

        <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:18px;color:var(--amber)">${c.inProgQty}</div><div class="sl">IN PROGRESS</div></div>
        <div class="stat" style="flex:1;min-width:100px"><div class="sv" style="font-size:18px;color:var(--mut)">${c.notStartedQty}</div><div class="sl">NOT STARTED</div></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="cardHead"><span>📈 BY RELEASE (selected slice)</span></div>
    <div style="padding:12px 16px;height:260px"><canvas id="releaseChart"></canvas></div>
  </div>`;
}

      </tbody></table></div>`:'<div class="empty">No production items yet. Add your first one above.</div>'}

    ${store.prodView==='zone'?prodZoneViewHTML(items):''}

}

// readiness checklist overlay — matches the Excel's 6-item pre-production check

  if(!store.prodReadyId)return '';
  const it=items.find(i=>i.id===store.prodReadyId); if(!it)return '';
  const r=prodReadyCalc(it);
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px">
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:420px;width:100%;padding:18px">
      <div style="display:flex;align-items:center;margin-bottom:4px"><strong style="color:${r.ready?'var(--green)':'var(--amber)'};font-size:14px">📋 READINESS — ${it.description||''}</strong><button id="prodReadyClose" class="zadd" style="margin-left:auto;padding:4px 10px">✕</button></div>
      <div class="hint" style="padding:0 0 10px">${r.ready?'✓ All checks complete — READY for production.':`${r.toApprove} of 6 checks still needed before this item is READY.`}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${READINESS_CHECKS.map(c=>`<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px"><input type="checkbox" data-readycheck="${c.k}" ${it[c.k]?'checked':''} style="width:18px;height:18px"> ${c.label}</label>`).join('')}
      </div>
    </div></div>`;
}
async function loadMyCatalogue(){
  if(!sb||!store.account)return;
  try{const {data}=await sb.from('catalogue').select('*').eq('supplier_id',store.account.uid).order('created_at',{ascending:true});store.myCatalogue=data||[];}catch(e){store.myCatalogue=[];}
  store.catLoaded=true;render();
}

// ============ PDF CATALOGUE BOOKLETS ============
// A supplier's catalogue is a booklet: pictures and words together on a page.
// So we keep the page intact. For each page we render an image AND pull out its
// text layer. Searching then works like searching a PDF - find the word, and the
// whole page opens so you see the product, its code and its photo in context.
async function uploadPdfCatalogue(file){
  if(typeof pdfjsLib==='undefined'){alert('PDF reader failed to load — check your connection and try again.');return;}
  store.pdfUp={name:file.name, done:0, total:0, noText:0}; render();
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    store.pdfUp.total=pdf.numPages; render();
    const rows=[];
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n);
      // text layer - this is what makes the booklet searchable
      let text='';
      try{
        const tc=await page.getTextContent();
        text=tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      }catch(e){}
      if(!text) store.pdfUp.noText++;
      // render the page to an image so we can show it as it was designed
      const viewport=page.getViewport({scale:1.6});
      const cv=document.createElement('canvas');
      cv.width=viewport.width; cv.height=viewport.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport}).promise;
      const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.82));
      const imgFile=new File([blob],`page-${n}.jpg`,{type:'image/jpeg'});
      let url='';
      try{ url=await uploadCataloguePhoto(imgFile); }catch(e){}
      rows.push({supplier_id:store.account.uid, supplier_name:store.account.company,
        doc_name:file.name, page_no:n, image_url:url, text_content:text});
      store.pdfUp.done=n; render();
    }
    for(let i=0;i<rows.length;i+=20){
      try{ await sb.from('catalogue_pages').insert(rows.slice(i,i+20)); }catch(e){}
    }
    const noText=store.pdfUp.noText, total=rows.length;
    store.pdfUp=null; store.catPagesLoaded=false; loadCataloguePages();
    alert(`Uploaded ${total} page${total>1?'s':''}.`+
      (noText? `\n\nNote: ${noText} page${noText>1?'s have':' has'} no text layer — likely scanned images. `+
               `Those pages will show in the booklet but won't be found by searching, because there are no words to search.`
            : `\n\nAll pages are searchable.`));
  }catch(e){
    store.pdfUp=null; render();
    alert('Could not read that PDF: '+(e.message||'error'));
  }
}

function snippetAround(text,term,len){
  if(!text)return '';
  const i=text.toLowerCase().indexOf(term.toLowerCase());
  if(i<0)return text.slice(0,len)+(text.length>len?'…':'');
  const start=Math.max(0,i-Math.floor(len/3));
  const raw=text.slice(start,start+len);
  const safe=raw.replace(/[<>]/g,'');
  const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return (start>0?'…':'')+safe.replace(re,'<mark style="background:var(--amber);color:#000">$1</mark>')+'…';
}

// Bulk photo upload. Suppliers keep product shots named by product code, so we
// match filename -> code automatically. "MEL-18-WHT.jpg", "MEL-18-WHT_2.jpg" and
// "mel 18 wht.png" all land on the right item. Anything unmatched can become a
// new catalogue entry, so a supplier can build a picture catalogue by dropping
// in a folder of photos.
function normCode(t){ return String(t||'').toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]/g,''); }
function baseName(fn){ return String(fn||'').replace(/\.[^.]+$/,'').replace(/[ _-]*\(?\d+\)?$/,''); }
async function bulkPhotoUpload(files){
  const list=Array.from(files||[]); if(!list.length)return;
  store.bulkPhoto={total:list.length, done:0, matched:0, created:0, failed:0, unmatched:[]};
  render();
  const byCode={};
  (store.myCatalogue||[]).forEach(c=>{ if(c.code) byCode[normCode(c.code)]=c; });
  const createMissing=confirm(
    `Upload ${list.length} photo${list.length>1?'s':''}?\n\n`+
    `Photos are matched to items by filename (e.g. MEL-18-WHT.jpg matches code MEL-18-WHT).\n\n`+
    `OK = also create new catalogue items for filenames that don't match anything\n`+
    `Cancel = only attach to items that already exist`);
  for(const f of list){
    try{
      const key=normCode(baseName(f.name));
      let item=byCode[key];
      if(!item && !createMissing){ store.bulkPhoto.unmatched.push(f.name); store.bulkPhoto.done++; render(); continue; }
      const url=await uploadCataloguePhoto(f);
      if(!item){
        const row={supplier_id:store.account.uid, supplier_name:store.account.company,
          kind:'', code:baseName(f.name), description:'', unit:'each', litres:0, container:'',
          price:0, currency:store.currency, region:store.account.location||'', photos:[url]};
        const {data,error}=await sb.from('catalogue').insert(row).select().single();
        if(error)throw error;
        store.myCatalogue.push(data); byCode[key]=data; store.bulkPhoto.created++;
      }else{
        const phs=Array.isArray(item.photos)?item.photos.slice():[];
        if(phs.length<2){
          phs.push(url); item.photos=phs;
          await sb.from('catalogue').update({photos:phs}).eq('id',item.id);
        }
        store.bulkPhoto.matched++;
      }
    }catch(e){ store.bulkPhoto.failed++; }
    store.bulkPhoto.done++; render();
  }
  const b=store.bulkPhoto;
  alert(`Photos done.\n${b.matched} attached to existing items`+
        (b.created?`\n${b.created} new items created from filenames`:'')+
        (b.unmatched.length?`\n${b.unmatched.length} skipped (no matching code)`:'')+
        (b.failed?`\n${b.failed} failed`:''));
  store.bulkPhoto=null; render();
}
async function uploadCataloguePhoto(file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=store.account.uid+'/'+Date.now()+'.'+ext;
  const {error}=await sb.storage.from('catalogue-photos').upload(path,file,{upsert:true});
  if(error){throw error;}
  const {data}=sb.storage.from('catalogue-photos').getPublicUrl(path);
  return data.publicUrl;
}

// ============ SUPPLIER CATALOGUE BULK IMPORT ============
// Suppliers already have their catalogue in a spreadsheet, and every supplier's
// spreadsheet is laid out differently. So instead of forcing them onto our
// template, we read whatever they have, guess which column is which, and let
// them correct the guesses before anything is saved.
const CAT_FIELDS=[
  {k:'kind',        label:'Category / type', hints:['category','type','kind','group','product type','classification','family']},
  {k:'code',        label:'Code / SKU',      hints:['code','item code','sku','part no','part number','ref','reference','article','model','item no']},
  {k:'description', label:'Description',     hints:['description','desc','name','item','product','details','particulars','material']},
  {k:'thk',         label:'Thickness',       hints:['thickness','thk','thick']},
  {k:'width',       label:'Width',           hints:['width','w','wide']},
  {k:'height',      label:'Height',          hints:['height','h','high']},
  {k:'length',      label:'Length',          hints:['length','len','long','l']},
  {k:'litres',      label:'Litres',          hints:['litres','liters','litre','liter','volume','ltr','ltrs']},
  {k:'container',   label:'Container / pack',hints:['container','pack','packaging','pack size','packing']},
  {k:'unit',        label:'Unit',            hints:['unit','uom','per','measure','unit of measure']},
  {k:'price',       label:'Price',           hints:['price','rate','cost','unit price','unit rate','amount','value','selling price','list price']},
  {k:'currency',    label:'Currency',        hints:['currency','cur','ccy']},
];
const CAT_NUMERIC=['thk','width','height','length','litres','price'];
function normHdr(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function guessMapping(headers){
  const map={}; const used={};
  CAT_FIELDS.forEach(f=>{
    let best=-1, bestScore=0;
    headers.forEach((h,i)=>{
      if(used[i])return;
      const n=normHdr(h); if(!n)return;
      let score=0;
      f.hints.forEach(hint=>{
        if(n===hint) score=Math.max(score,100);
        else if(n.replace(/ /g,'')===hint.replace(/ /g,'')) score=Math.max(score,95);
        else if(n.startsWith(hint+' ')||n.endsWith(' '+hint)) score=Math.max(score,80);
        else if(hint.length>2 && n.includes(hint)) score=Math.max(score,60);
      });
      if(score>bestScore){bestScore=score;best=i;}
    });
    if(best>=0 && bestScore>=60){ map[f.k]=best; used[best]=true; }
  });
  return map;
}
function downloadCatTemplate(){
  if(typeof XLSX==='undefined'){alert('Excel library still loading — try again in a second.');return;}
  const aoa=[CAT_FIELDS.map(f=>f.label),
    ['Board','MEL-18-WHT','White melamine faced MDF',18,1220,2440,'','','','sheet',52,'AED'],
    ['Paint','PU-CLR-5L','PU clear lacquer','','','','',5,'5L tin','tin',180,'AED']];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Catalogue');
  XLSX.writeFile(wb,'fit-out-iq-catalogue-template.xlsx');
}
function openCatImport(file){
  if(typeof XLSX==='undefined'){alert('Excel library still loading — try again in a second.');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const sheetNames=wb.SheetNames;
      const pick=(name)=>{
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});
        // find the first row that looks like a header: several non-empty text cells
        let hdrIdx=0;
        for(let i=0;i<Math.min(raw.length,15);i++){
          const filled=raw[i].filter(c=>String(c).trim()!=='').length;
          if(filled>=3){hdrIdx=i;break;}
        }
        const headers=(raw[hdrIdx]||[]).map(h=>String(h||'').trim());
        const rows=raw.slice(hdrIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
        return {headers,rows};
      };
      store.catImp={file:file.name, wb, sheetNames, sheet:sheetNames[0], ...pick(sheetNames[0]), skipDupes:true};
      store.catImp.map=guessMapping(store.catImp.headers);
      render();
    }catch(ex){alert('Could not read that file: '+(ex.message||'error'));}
  };
  reader.readAsArrayBuffer(file);
}
function catImportSwitchSheet(name){
  const imp=store.catImp; if(!imp)return;
  const raw=XLSX.utils.sheet_to_json(imp.wb.Sheets[name],{header:1,defval:''});
  let hdrIdx=0;
  for(let i=0;i<Math.min(raw.length,15);i++){
    if(raw[i].filter(c=>String(c).trim()!=='').length>=3){hdrIdx=i;break;}
  }
  imp.sheet=name;
  imp.headers=(raw[hdrIdx]||[]).map(h=>String(h||'').trim());
  imp.rows=raw.slice(hdrIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
  imp.map=guessMapping(imp.headers);
  render();
}
function catImportRowToItem(r){
  const imp=store.catImp, m=imp.map, out={};
  CAT_FIELDS.forEach(f=>{
    const idx=m[f.k];
    if(idx===undefined||idx===null||idx===''){ out[f.k] = CAT_NUMERIC.indexOf(f.k)>=0?0:''; return; }
    let v=r[idx];
    if(CAT_NUMERIC.indexOf(f.k)>=0){
      // tolerate "18mm", "AED 52.00", "1,220"
      const num=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
      out[f.k]=isNaN(num)?0:num;
    }else{
      out[f.k]=String(v==null?'':v).trim();
    }
  });
  return out;
}
async function runCatImport(){
  const imp=store.catImp; if(!imp)return;
  if(imp.map.code===undefined && imp.map.description===undefined){
    alert('Map at least a Code or a Description column — otherwise the items have no name.');return;
  }
  const items=imp.rows.map(catImportRowToItem).filter(it=>(it.code||it.description));
  if(!items.length){alert('No usable rows found.');return;}
  if(!confirm(`Import ${items.length} items into your catalogue?`))return;
  store.catImpBusy=true; render();
  const existing={}; (store.myCatalogue||[]).forEach(c=>{ if(c.code) existing[String(c.code).toLowerCase()]=c; });
  let added=0, updated=0, failed=0;
  const toInsert=[];
  for(const it of items){
    const key=String(it.code||'').toLowerCase();
    const dupe=key?existing[key]:null;
    if(dupe && imp.skipDupes){
      try{ await catUpdate(dupe.id,{price:it.price, description:it.description||dupe.description}); updated++; }
      catch(e){ failed++; }
    }else{
      toInsert.push({supplier_id:store.account.uid, supplier_name:store.account.company,
        kind:it.kind, code:it.code||'(no code)', description:it.description,
        thk:it.thk, width:it.width, height:it.height, length:it.length,
        litres:it.litres, container:it.container, unit:it.unit||'each',
        price:it.price, currency:it.currency||store.currency,
        region:store.account.location||''});
    }
  }
  for(let i=0;i<toInsert.length;i+=100){
    const batch=toInsert.slice(i,i+100);
    try{
      const {data,error}=await sb.from('catalogue').insert(batch).select();
      if(error)throw error;
      store.myCatalogue=[...(store.myCatalogue||[]),...(data||[])];
      added+=batch.length;
    }catch(e){ failed+=batch.length; }
  }
  store.catImp=null; store.catImpBusy=false; render();
  alert(`Import complete: ${added} added${updated?`, ${updated} price-updated`:''}${failed?`, ${failed} failed`:''}.`);
}

function wireCatImport(){

  if(f)f.onchange=e=>{const file=e.target.files[0]; if(file)openCatImport(file); e.target.value='';};

// render an uploaded file as a photo thumbnail (images) or a document icon + link
// (PDFs, Word docs, anything else) — since Site Visit now accepts any file type.
// `target` identifies where a markup save should be written back to: 'draft' for the
// unsaved form, or a saved visit's id.
function attachCell(url,size,target){
  const s=size||60;
  const ext=(url.split('.').pop()||'').split('?')[0].toLowerCase();
  const isImg=['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext);
  const isPdf=ext==='pdf';
  const markupBtn=(isImg||isPdf)&&target?`<button data-markup="${target}|${encodeURIComponent(url)}" title="Mark up this ${isPdf?'PDF':'photo'}" style="position:absolute;bottom:-6px;right:-6px;background:var(--blue);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer">✏</button>`:'';
  if(isImg)return `<div style="position:relative;display:inline-block"><img src="${url}" data-bigphoto="${url}" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer">${markupBtn}</div>`;
  const icon={pdf:'📕',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📙',pptx:'📙'}[ext]||'📄';
  return `<div style="position:relative;display:inline-block"><a href="${url}" target="_blank" rel="noopener" title="Open document" style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:${s}px;height:${s}px;border:1px solid var(--line);border-radius:4px;text-decoration:none;background:var(--steel)"><span style="font-size:${Math.round(s*0.4)}px">${icon}</span><span style="font-size:8px;color:var(--mut);text-transform:uppercase">${ext||'file'}</span></a>${markupBtn}</div>`;
}
