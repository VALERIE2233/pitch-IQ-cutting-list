if(typeof pdfjsLib!=='undefined'){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js'; }
async function openMarkup(target,url){
  store.markupTarget=target; store.markupSourceUrl=url;
  store.markupStrokes=[]; store.markupTool='pen'; store.markupColor='#e0392b';
  store.markupLoading=true; store.markupImg=null; render();
  try{
    const ext=(url.split('.').pop()||'').split('?')[0].toLowerCase();
    let imgUrl=url;
    if(ext==='pdf'){
      if(typeof pdfjsLib==='undefined')throw new Error('PDF viewer failed to load — check your connection and try again.');
      const resp=await fetch(url); const buf=await resp.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const page=await pdf.getPage(1);
      const viewport=page.getViewport({scale:2});
      const off=document.createElement('canvas'); off.width=viewport.width; off.height=viewport.height;
      await page.render({canvasContext:off.getContext('2d'),viewport}).promise;
      imgUrl=off.toDataURL('image/png');
    }
    const img=new Image(); img.crossOrigin='anonymous';
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Could not load that image.'));img.src=imgUrl;});
    store.markupImg={src:imgUrl,w:img.naturalWidth,h:img.naturalHeight};
    store.markupLoading=false; render();
    setTimeout(()=>drawMarkupCanvas(),30);
  }catch(ex){store.markupLoading=false; store.markupTarget=null; alert('Could not open for markup: '+(ex.message||'error')); render();}
}
function drawMarkupCanvas(){
  const cv=document.getElementById('markupCanvas'); if(!cv||!store.markupImg)return;
  const ctx=cv.getContext('2d');
  const img=cv._bgImg||(cv._bgImg=(()=>{const i=new Image();i.crossOrigin='anonymous';i.src=store.markupImg.src;return i;})());
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    (store.markupStrokes||[]).forEach(s=>drawStroke(ctx,s));
  };
  if(img.complete)draw(); else img.onload=draw;
}
function drawStroke(ctx,s){
  ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
  if(s.type==='pen'&&s.points.length){
    ctx.beginPath(); ctx.moveTo(s.points[0].x,s.points[0].y);
    s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
  }else if(s.type==='line'){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  }else if(s.type==='text'){
    ctx.font='bold 20px Arial'; ctx.fillText(s.text,s.x,s.y);
  }
}
async function saveMarkup(){
  const cv=document.getElementById('markupCanvas'); if(!cv)return;
  store.markupSaving=true; render();
  try{
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    const file=new File([blob],'marked-'+Date.now()+'.png',{type:'image/png'});
    const url=await uploadSiteVisitPhoto(file);
    const target=store.markupTarget;
    if(target==='draft'){
      if(!store.svDraft)store.svDraft={};
      store.svDraft.photos=[...(store.svDraft.photos||[]),url];
    }else if(target.startsWith('factory:')){
      // marking up a drawing the factory sent — save the result to marked_attachments
      // and flag the source factory_attachment as reviewed, so both sides see progress.
      const [,visitId,idxStr]=target.split(':'); const idx=+idxStr;
      const visit=(store.siteVisits||[]).find(v=>v.id===visitId);
      if(visit){
        const fAtts=Array.isArray(visit.factory_attachments)?[...visit.factory_attachments]:[];
        const source=fAtts[idx]; if(source)fAtts[idx]={...source,status:'reviewed'};
        const mAtts=[...(Array.isArray(visit.marked_attachments)?visit.marked_attachments:[]),
          {url, source_url:source?source.url:null, marked_by:store.account.name||store.account.email, marked_at:new Date().toISOString()}];
        visit.factory_attachments=fAtts; visit.marked_attachments=mAtts;
        try{await sb.from('site_visits').update({factory_attachments:fAtts,marked_attachments:mAtts}).eq('id',visitId);}catch(ex){}
      }
    }else{
      const visit=(store.siteVisits||[]).find(v=>v.id===target);
      if(visit){
        const photos=[...(Array.isArray(visit.photos)?visit.photos:[]),url];
        visit.photos=photos;
        try{await sb.from('site_visits').update({photos}).eq('id',target);}catch(ex){}
      }
    }
    store.markupTarget=null; store.markupSaving=false; render();
  }catch(ex){store.markupSaving=false; alert('Could not save markup: '+(ex.message||'error')); render();}
}

        <button class="zadd" id="markUndo">↶ UNDO</button>
        <button class="zadd" id="markClear">🗑 CLEAR</button>
        <div style="flex:1"></div>
        <button class="pbtn" id="markCancel">✕ CANCEL</button>
        <button class="add" id="markSave" ${store.markupSaving?'disabled':''}>${store.markupSaving?'SAVING…':'✓ SAVE MARKUP'}</button>
      </div>
      <canvas id="markupCanvas" width="${cw}" height="${ch}" style="border:1px solid var(--line);cursor:crosshair;touch-action:none;max-width:100%"></canvas>
      <div class="hint">Pen: draw freehand. Line: click-drag for a straight line. Text: click to place a label.</div>
    </div></div>`;

}

// ============ SITE ATTENDANCE ============
// Fingerprint here means WebAuthn: the phone's own sensor confirms its owner is
// present. The browser never sees the print itself, and this only works on the
// device where the engineer registered - which is exactly what we want for
// attendance. GPS is captured too, and is the stronger anti-fraud signal.
function b64urlFromBuf(buf){
  const b=new Uint8Array(buf); let str='';
  for(let i=0;i<b.length;i++) str+=String.fromCharCode(b[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function bufFromB64url(s){
  const pad='='.repeat((4-(s.length%4))%4);
  const b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const arr=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) arr[i]=b.charCodeAt(i);
  return arr.buffer;
}
function biometricSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
async function loadBioCreds(){
  store.bioLoaded=true;
  if(!sb||!store.account){store.bioCreds=[];return;}
  try{const {data}=await sb.from('biometric_credentials').select('*').eq('user_id',store.account.uid);store.bioCreds=data||[];}
  catch(e){store.bioCreds=[];}
  render();
}
async function registerBiometric(){
  if(!biometricSupported()){alert("This device or browser doesn't support fingerprint sign-in.");return;}
  try{
    const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
    const userId=new Uint8Array(16); crypto.getRandomValues(userId);
    const cred=await navigator.credentials.create({publicKey:{
      challenge,
      rp:{name:'FIT-OUT IQ'},
      user:{id:userId, name:store.account.email, displayName:store.account.name||store.account.email},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
      timeout:60000, attestation:'none'
    }});
    if(!cred){alert('Registration cancelled.');return;}
    const row={user_id:store.account.uid, company_id:store.account.companyId,
      credential_id:b64urlFromBuf(cred.rawId), device_label:(navigator.platform||'this device')};
    const {error}=await sb.from('biometric_credentials').insert(row);
    if(error){alert('Could not save: '+error.message);return;}
    store.bioLoaded=false; await loadBioCreds();
    alert('Fingerprint registered on this device. You can now sign in and out with it.');
  }catch(e){
    alert(e.name==='NotAllowedError' ? 'Fingerprint registration was cancelled or timed out.'
         : 'Could not register fingerprint: '+(e.message||e.name));
  }
}
async function verifyBiometric(){
  const creds=store.bioCreds||[];
  if(!creds.length || !biometricSupported()) return false;
  try{
    const challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
    const assertion=await navigator.credentials.get({publicKey:{
      challenge,
      allowCredentials:creds.map(c=>({type:'public-key', id:bufFromB64url(c.credential_id)})),
      userVerification:'required', timeout:60000
    }});
    return !!assertion;
  }catch(e){ return false; }
}
// Best-effort location. Never block a punch on it - a refused permission or a
// basement with no signal shouldn't stop someone recording their hours.
function getPosition(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lng:p.coords.longitude}),
      ()=>res(null), {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  });
}
async function loadAttendance(){
  store.attLoaded=true;
  if(!sb||!store.account){store.attendance=[];render();return;}
  try{const {data}=await sb.from('attendance').select('*').eq('company_id',store.account.companyId)
    .order('sign_in_at',{ascending:false});store.attendance=data||[];}
  catch(e){store.attendance=[];}
  render();
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function myOpenShift(){
  return (store.attendance||[]).find(a=>a.user_id===store.account.uid && a.sign_out_at==null);
}
async function attendanceSignIn(){
  const projSel=document.getElementById('att_project');
  const projectId=projSel?projSel.value:'';
  if(!projectId){alert('Pick the project you are working on.');return;}
  const proj=(store.projects||[]).find(p=>p.id===projectId);
  store.attBusy=true; render();
  let method='basic';
  if((store.bioCreds||[]).length){
    const ok=await verifyBiometric();
    if(!ok){store.attBusy=false;render();alert('Fingerprint not recognised - sign-in cancelled.');return;}
    method='fingerprint';
  }
  const pos=await getPosition();
  const row={company_id:store.account.companyId, project_id:projectId, project_name:proj?proj.name:'',
    user_id:store.account.uid, user_name:store.account.name||store.account.email,
    work_date:todayStr(), sign_in_at:new Date().toISOString(),
    sign_in_lat:pos?pos.lat:null, sign_in_lng:pos?pos.lng:null, sign_in_method:method};
  try{
    const {data,error}=await sb.from('attendance').insert(row).select().single();
    if(error)throw error;
    store.attendance=[data,...(store.attendance||[])];
  }catch(e){alert('Could not sign in: '+(e.message||'error'));}
  store.attBusy=false; render();
}
async function attendanceSignOut(){
  const open=myOpenShift(); if(!open)return;
  store.attBusy=true; render();
  let method='basic';
  if((store.bioCreds||[]).length){
    const ok=await verifyBiometric();
    if(!ok){store.attBusy=false;render();alert('Fingerprint not recognised - sign-out cancelled.');return;}
    method='fingerprint';
  }
  const pos=await getPosition();
  const patch={sign_out_at:new Date().toISOString(), sign_out_lat:pos?pos.lat:null,
    sign_out_lng:pos?pos.lng:null, sign_out_method:method};
  Object.assign(open,patch); render();
  try{await sb.from('attendance').update(patch).eq('id',open.id);}catch(e){}
  store.attBusy=false; render();
}
function shiftHours(a){
  if(!a.sign_in_at||!a.sign_out_at)return '';
  const ms=new Date(a.sign_out_at)-new Date(a.sign_in_at);
  if(ms<=0)return '';
  const h=Math.floor(ms/3600000), m=Math.round((ms%3600000)/60000);
  return h+'h '+String(m).padStart(2,'0')+'m';
}

async function addCrewMember(){
  const nm=(document.getElementById('crew_name')||{}).value||'';
  const tr=(document.getElementById('crew_trade')||{}).value||'';
  if(!nm.trim()){alert('Enter the worker\'s name.');return;}
  const row={company_id:store.account.companyId, name:nm.trim(), trade:tr.trim(), active:true};
  try{
    const {data,error}=await sb.from('crew_members').insert(row).select().single();
    if(error)throw error;
    store.crew=[...(store.crew||[]),data].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    render();
  }catch(e){alert('Could not add: '+(e.message||'error'));}

async function removeCrewMember(id){
  if(!confirm('Remove this worker from the roster? Past attendance records are kept.'))return;
  store.crew=(store.crew||[]).filter(c=>c.id!==id); render();
  try{await sb.from('crew_members').update({active:false}).eq('id',id);}catch(e){}
}
function crewKey(){ return (store.crewProject||'')+'|'+(store.crewDate||todayStr()); }
function crewRecordFor(memberId){
  const pid=store.crewProject, d=store.crewDate||todayStr();
  return (store.crewAtt||[]).find(a=>a.crew_member_id===memberId && a.project_id===pid && a.work_date===d);
}
function setCrewStatus(memberId,status){
  if(!store.crewDraft)store.crewDraft={};
  const k=crewKey()+'|'+memberId;
  store.crewDraft[k] = (store.crewDraft[k]===status) ? null : status;
  render();
}
function crewStatusOf(memberId){
  const k=crewKey()+'|'+memberId;
  if(store.crewDraft && store.crewDraft[k]!==undefined && store.crewDraft[k]!==null) return store.crewDraft[k];
  if(store.crewDraft && store.crewDraft[k]===null) return null;
  const rec=crewRecordFor(memberId);
  return rec?rec.status:null;
}
async function saveCrewAttendance(){
  const pid=store.crewProject, d=store.crewDate||todayStr();
  if(!pid){alert('Pick a project first.');return;}
  const proj=(store.projects||[]).find(p=>p.id===pid);
  const marked=(store.crew||[]).map(c=>({c, st:crewStatusOf(c.id)})).filter(x=>x.st);
  if(!marked.length){alert('Mark at least one worker present or absent.');return;}
  store.crewBusy=true; render();
  const pos=await getPosition();
  let ok=0, fail=0;
  for(const {c,st} of marked){
    const existing=crewRecordFor(c.id);
    if(existing){
      const patch={status:st, recorded_by:store.account.uid, recorded_by_name:store.account.name||store.account.email,
        recorded_at:new Date().toISOString(), lat:pos?pos.lat:null, lng:pos?pos.lng:null};
      Object.assign(existing,patch);
      try{await sb.from('crew_attendance').update(patch).eq('id',existing.id); ok++; }catch(e){ fail++; }
    }else{
      const row={company_id:store.account.companyId, project_id:pid, project_name:proj?proj.name:'',
        crew_member_id:c.id, worker_name:c.name, trade:c.trade, work_date:d, status:st,
        recorded_by:store.account.uid, recorded_by_name:store.account.name||store.account.email,
        lat:pos?pos.lat:null, lng:pos?pos.lng:null};
      try{
        const {data,error}=await sb.from('crew_attendance').insert(row).select().single();
        if(error)throw error;
        store.crewAtt=[data,...(store.crewAtt||[])]; ok++;
      }catch(e){ fail++; }
    }
  }
  store.crewDraft={}; store.crewBusy=false; render();
  alert(`Saved ${ok} record${ok===1?'':'s'}${fail?`, ${fail} failed`:''}.`);
}

async function acknowledgeOrder(id){

// ---- RAL Paint Mixer tool — self-contained, embedded via base64 data URL so its
// own JS/CSS never touches the main app's scope. ----
// Decode the embedded tool as proper UTF-8 (it contains -, degree, delta etc).
function b64ToUtf8(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
// Loaded via srcdoc rather than a data: URL. A data: URL has an opaque origin,
// which means localStorage throws inside it - so the mixer could never remember
// your calibration. srcdoc runs same-origin while still being its own document,
// so the tool stays isolated from Fit-Out IQ's CSS/JS but can save its settings.
// ============ ACCOUNT: EDIT / DELETE (self-service, every role) ============
// One shared overlay reused across all five dashboards, so there's a single
// place this logic lives and gets tested, rather than five copies.

// Honest limit, stated plainly in the UI too: a regular account can never
// delete its own LOGIN (email/password) - that lives in Supabase Auth, and
// only a project administrator can remove it (via the Authentication panel,
// or an Admin API key that must never sit in client-side code, since exposing
// it would let anyone delete anyone). What this DOES do: remove the person's
// own data, and sign them out. Full closure needs an administrator afterwards.

function wireAccountOverlay(){
  const btn=document.getElementById('myAccountBtn');
  if(btn)btn.onclick=()=>{store.showAccountPanel=true;store.acctDraft={name:store.account.name||'',phone:store.account.phone||''};store.acctMsg='';store.acctDelMsg='';store.showDeleteConfirm=false;render();};
  const close=document.getElementById('acctClose');
  if(close)close.onclick=()=>{store.showAccountPanel=false;render();};
  const nm=document.getElementById('acct_name'); if(nm)nm.oninput=()=>{store.acctDraft.name=nm.value;};
  const ph=document.getElementById('acct_phone'); if(ph)ph.oninput=()=>{store.acctDraft.phone=ph.value;};
  const save=document.getElementById('acctSave');
  if(save)save.onclick=async()=>{
    const name=(document.getElementById('acct_name')||{}).value||'';
    const phone=(document.getElementById('acct_phone')||{}).value||'';
    const pw=(document.getElementById('acct_pw')||{}).value||'';
    if(pw && pw.length<6){store.acctMsg='Password must be at least 6 characters.';store.acctErr=true;render();return;}
    store.acctBusy=true;store.acctMsg='';render();
    try{
      await sb.from('profiles').update({full_name:name,phone}).eq('id',store.account.uid);
      if(pw){const {error}=await sb.auth.updateUser({password:pw}); if(error)throw error;}
      store.account.name=name; store.account.phone=phone;
      store.acctMsg='Saved.'; store.acctErr=false;
    }catch(e){store.acctMsg='Could not save: '+(e.message||'error'); store.acctErr=true;}
    store.acctBusy=false; render();
  };
  const delStart=document.getElementById('acctDeleteStart');
  if(delStart)delStart.onclick=()=>{store.showDeleteConfirm=true;render();};
  const delCancel=document.getElementById('acctDeleteCancel');
  if(delCancel)delCancel.onclick=()=>{store.showDeleteConfirm=false;render();};
  const delConfirm=document.getElementById('acctDeleteConfirm');
  if(delConfirm)delConfirm.onclick=async()=>{
    const txt=(document.getElementById('acct_delete_confirm')||{}).value||'';
    if(txt.trim().toUpperCase()!=='DELETE'){store.acctDelMsg='Type DELETE exactly to confirm.';render();return;}
    store.acctBusy=true;store.acctDelMsg='';render();
    const uid=store.account.uid;
    try{
      await sb.from('biometric_credentials').delete().eq('user_id',uid);
      await sb.from('attendance').delete().eq('user_id',uid);
      await sb.from('site_visits').delete().eq('site_engineer_id',uid);
      await sb.from('profiles').delete().eq('id',uid);
      await sb.auth.signOut();
      alert('Your account data has been removed and you have been signed out. To fully close your login, contact your administrator.');
      window.location.reload();
    }catch(e){
      store.acctBusy=false; store.acctDelMsg='Could not complete deletion: '+(e.message||'error'); render();
    }
  };
}

async function forwardToContractor(visitId,idx){

function orderHTML(){
  const lin=optimiseLinear(store.stockLen,store.linKerf,store.linRows.filter(r=>r.len>0&&r.qty>0));
  const sh=optimiseSheets(store.sheetW,store.sheetH,store.sheetKerf,store.grain,store.sheetRows.filter(r=>r.w>0&&r.h>0&&r.qty>0).map(r=>({...r,...cutSize(r)})));
  let paintL=0,paintC=0;store.paintRows.forEach(r=>{const p=paintCalc(r);paintL+=p.litres;paintC+=p.cost;});
  const linOff=offerLinear(store.linCode,store.linThk,store.stockLen), shOff=offerSheet(store.sheetCode,store.sheetThk,store.sheetW,store.sheetH);
  const linC=lin.barCount*linOff.price, shC=sh.sheetCount*shOff.price;
  // assembly totals
  let assyTotal=0; const assyResults=store.assemblyRows.map(r=>({row:r,res:assemblyCost(r)}));
  assyResults.forEach(a=>assyTotal+=a.res.total);
  // custom assemblies
  let customTotal=0; const customResults=store.customAssemblies.map(ca=>({ca,res:customCost(ca)}));
  customResults.forEach(a=>customTotal+=a.res.total);
  // lipping totals across ALL panels
  const lipAll=lipDemand(store.sheetRows.filter(r=>r.w>0&&r.h>0&&r.qty>0));
  let lipTotalLM=0, lipCost=0;
  lipAll.forEach(l=>{lipTotalLM+=l.totalMM/1000;lipCost+=l.cost;});
  const grand=linC+shC+paintC+assyTotal+lipCost+customTotal;
  // per-supplier split — every line attributed to its chosen supplier
  const bySup={};
  const add=(s,line,cost)=>{const k=s||'(no supplier set)';if(!bySup[k])bySup[k]={lines:[],total:0};bySup[k].lines.push(line);bySup[k].total+=cost;};
  if(lin.barCount>0) add(linOff.supplier, {item:`Linear ${store.linCode} ${store.linThk}mm @ ${fmt(store.stockLen)}${u()}`, qty:lin.barCount+' bars', cost:linC}, linC);
  if(sh.sheetCount>0) add(shOff.supplier, {item:`Sheet ${store.sheetCode} ${store.sheetThk}mm @ ${fmt(store.sheetW)}×${fmt(store.sheetH)}`, qty:sh.sheetCount+' sheets', cost:shC}, shC);
  lipAll.forEach(l=>{if(l.cost>0)add(l.supplier,{item:`Lipping ${l.code} ${l.thk}mm @ ${fmt(l.stockLen)}${u()}`,qty:l.lengthsToBuy+' lengths ('+(l.totalMM/1000).toFixed(1)+' LM net)',cost:l.cost},l.cost);});
  store.paintRows.forEach(r=>{const p=paintCalc(r);if(p.cost>0)add(p.supplier, {item:`Paint ${r.stage||''} ${r.code} (${zoneName(r.zone)})`, qty:p.litres.toFixed(1)+' L', cost:p.cost}, p.cost);});
  assyResults.forEach(a=>{const tpl=ASSEMBLIES[a.row.type];a.res.items.forEach(it=>{if(it.cost>0)add(it.supplier,{item:`${tpl?tpl.name:a.row.type} · ${it.desc}${it.code?' ['+it.code+']':''} (${zoneName(a.row.zone)})`,qty:it.qty+' '+(it.unit||''),cost:it.cost},it.cost);});});
  customResults.forEach(a=>{a.res.items.forEach(it=>{if(it.cost>0)add(it.supplier,{item:`${a.ca.name} · ${it.name||it.code} (${zoneName(a.ca.zone)})`,qty:it.qty+' '+(it.unit||''),cost:it.cost},it.cost);});});
  const supEntries=Object.entries(bySup).sort((a,b)=>b[1].total-a[1].total);
  store._supEntries=supEntries;
  if(!store.myOrdersLoaded){loadMyOrders();}
  if(!store.catAllLoaded){loadCatalogueAll();}
  const projOrders=(store.myOrders||[]).filter(o=>o.project_id===_workspaceId);
  const statusColor=s=>s==='approved'?'var(--green)':s==='sent'?'var(--blue)':s==='rejected'?'var(--red)':s==='pending_approval'?'var(--amber)':'var(--mut)';
  const statusLabel=s=>(s||'').replace('_',' ').toUpperCase();
  // list of selectable suppliers: my pinned/known + all Fit-Out IQ suppliers
  const knownSuppliers=Array.from(new Set([
    ...supEntries.map(([s])=>s),
    ...((store.catalogueAll||[]).map(c=>c.supplier_name).filter(Boolean))
  ])).filter(s=>s&&s!=='(no supplier set)').sort();

  // ---- self-contained per-supplier order card ----
  const supplierCard=([sup,d],si)=>{
    // the supplier this card actually sends to (reassigned target if chosen, else its own name)
    const target=(store._supReassign&&store._supReassign[si])||sup;
    const toProcurement = target==='__PROCUREMENT__';
    // match a prior order by EITHER the card's own name or the reassigned target,
    // so a reassigned order still shows its status/buttons on this card
    const priorO=toProcurement?null:(store.myOrders||[]).filter(o=>(o.supplier_name===target||o.supplier_name===sup) && o.project_id===_workspaceId).sort((a,b)=>(b.revision||1)-(a.revision||1))[0];
    const status=priorO?priorO.status:null;
    const pending=status==='pending_approval';
    let actionRow='';
    if(toProcurement){
      actionRow=`<button class="zadd" data-submitsupplier="${si}" style="margin-top:10px;border-color:var(--blue);color:var(--blue);width:100%">📦 SEND TO PROCUREMENT</button>`;
    }else if(pending){
      actionRow=`<div style="margin-top:10px;padding:9px;border:1px solid var(--amber);color:var(--amber);text-align:center;font-size:11px;letter-spacing:1px;border-radius:4px">⏳ REVISION ${priorO.revision||1} — PENDING MANAGER APPROVAL</div>`;
    }else{
      actionRow=`<button class="zadd" data-submitsupplier="${si}" style="margin-top:10px;border-color:var(--amber);color:var(--amber);width:100%">▲ ${priorO?`SUBMIT REVISION ${(priorO.revision||1)+1}`:'SUBMIT THIS ORDER FOR APPROVAL'}</button>`;
    }
    // status / green approve line shown inline on the same card
    let statusLine='';
    if(priorO){
      const col=statusColor(status);
      statusLine=`<div style="margin-top:10px;padding:8px 10px;border-left:4px solid ${col};background:rgba(255,255,255,0.03);font-size:11px">
        <strong style="color:${col}">${statusLabel(status)}</strong> · Rev ${priorO.revision||1}${priorO.approver_name?` · by ${priorO.approver_name}${priorO.approver_title?' ('+priorO.approver_title+')':''}`:''}${priorO.approved_at?` · ${new Date(priorO.approved_at).toLocaleDateString()}`:''}
        ${priorO.approver_note?`<div style="color:var(--mut);margin-top:3px">Note: ${priorO.approver_note}</div>`:''}
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="zadd" data-thread="${priorO.id}" style="padding:5px 10px;font-size:10px;border-color:var(--blue);color:var(--blue)">💬 MESSAGES${unreadBadge(priorO.id)}</button>
          ${status==='approved'?`<button class="zadd" data-cert="${priorO.id}" style="padding:5px 10px;font-size:10px;border-color:var(--green);color:var(--green)">⎙ CERTIFICATE</button> <button class="zadd" data-sendsup="${priorO.id}" style="padding:5px 10px;font-size:10px;border-color:var(--amber);color:var(--amber)">▶ SEND TO SUPPLIER</button>`:''}
          ${status==='sent'?`<button class="zadd" data-cert="${priorO.id}" style="padding:5px 10px;font-size:10px;border-color:var(--green);color:var(--green)">⎙ CERTIFICATE</button> <span style="font-size:10px;color:var(--blue);align-self:center">✓ SENT TO SUPPLIER</span>`:''}
        </div>
        ${threadPanel(priorO)}
      </div>`;
    }
    return `<div class="orderCard" style="margin-bottom:14px"><div class="orderHead" style="display:flex;justify-content:space-between;align-items:center"><span>◆ ORDER · ${sup}</span><span class="cost">${money(d.total)}</span></div><div class="orderBody">
      <div style="font-size:12px">${d.lines.map(l=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${l.item}</span><span style="color:var(--mut)">${l.qty} · ${money(l.cost)}</span></div>`).join('')}</div>
      <div style="margin-top:10px;font-size:11px;color:var(--mut)">Send this order to:
        <select class="sel" data-reassign="${si}" style="margin-left:6px;padding:6px">
          <option value="">${sup}${knownSuppliers.includes(sup)?'':' (current)'}</option>
          ${knownSuppliers.filter(s=>s!==sup).map(s=>`<option value="${s}">${s}</option>`).join('')}
          <option value="__PROCUREMENT__" ${toProcurement?'selected':''} style="color:#5db8ff">📦 Procurement (review before it goes to your manager)</option>
        </select></div>
      ${actionRow}
      ${statusLine}
    </div></div>`;
  };

  const supplierCards = supEntries.length
    ? supEntries.map(supplierCard).join('')
    : '<div class="empty">No supplier-attributed items yet — set prices and suppliers in the Price Book, or pull items from the Catalogue.</div>';

  const wholeOrderCard = supEntries.length ? `<div class="orderCard" style="margin-bottom:14px"><div class="orderHead">◆ SEND WHOLE ORDER TO ONE SUPPLIER</div><div class="orderBody">

    <button class="cta" id="submitAll" style="width:100%;margin-top:10px">▲ SUBMIT WHOLE ORDER FOR APPROVAL</button>
  </div></div>` : '';

  const costSummary = `<div class="orderCard"><div class="orderHead">◆ MATERIAL ORDER & COST — SUMMARY (glance)</div><div class="orderBody">
    <div class="orderLine"><span>Linear stock @ ${fmt(store.stockLen)}${u()} <small style="color:var(--mut)">${linOff.supplier||'—'}${linOff.fellBack?' (fallback)':''}</small></span><span class="orderQty">${lin.barCount} <small>bars · ${money(linC)}</small></span></div>
    <div class="orderLine"><span>Sheet board @ ${fmt(store.sheetW)}×${fmt(store.sheetH)} <small style="color:var(--mut)">${shOff.supplier||'—'}${shOff.fellBack?' (fallback)':''}</small></span><span class="orderQty">${sh.sheetCount} <small>sheets · ${money(shC)}</small></span></div>
    <div class="orderLine"><span>Lipping (${lipAll.length} type${lipAll.length===1?'':'s'})</span><span class="orderQty">${lipTotalLM.toFixed(1)} <small>LM · ${money(lipCost)}</small></span></div>
    <div class="orderLine"><span>Paint (${store.paintRows.length} coat row${store.paintRows.length===1?'':'s'})</span><span class="orderQty">${paintL.toFixed(1)} <small>L · ${money(paintC)}</small></span></div>
    <div class="orderLine"><span>Assemblies (${store.assemblyRows.length})</span><span class="orderQty">${money(assyTotal)}</span></div>
    <div class="orderLine"><span>Custom assemblies (${store.customAssemblies.length})</span><span class="orderQty">${money(customTotal)}</span></div>

    <div class="orderLine" style="font-size:13px"><span>Tax / VAT <input class="num numS" type="number" id="taxPct" value="${store.taxPct}" style="width:48px;margin-left:6px"> %</span><span>${money(grand*(store.taxPct||0)/100)}</span></div>
    <div class="orderTotal"><span>TOTAL INC. TAX</span><span>${money(grand*(1+(store.taxPct||0)/100))}</span></div>
  </div></div>`;

  const procSection=store.account.accountType==='contractor' && myProcReqs.length?`<div class="card" style="border-color:var(--blue)">
    <div class="cardHead" style="color:var(--blue)"><span>📦 PROCUREMENT SUBMISSIONS</span></div>
    <div class="hint" style="padding:0 12px 8px">Pick "📦 Procurement" from the "Send this order to" dropdown on any card below to route it for review before it goes to your manager.</div>
    <div class="scroll"><table><thead><tr><th>Date</th><th>Status</th><th></th></tr></thead><tbody>
    ${myProcReqs.map(r=>`<tr><td style="font-size:11px">${(r.created_at||'').slice(0,10)}</td>
      <td>${procStatusBadge(r.status)}</td>
      <td>${r.status==='sent_to_contractor'?`<button class="zadd" data-viewprocreq="${r.id}" style="font-size:10px;padding:4px 8px">👁 VIEW & CONFIRM</button>`:''}</td>
    </tr>`).join('')}</tbody></table>
  </div>`:store.account.accountType==='procurement'?`<div class="card" style="border-color:var(--blue)">
    <div class="cardHead" style="color:var(--blue)"><span>📦 MATERIAL REQUESTS FOR THIS PROJECT</span></div>
    ${myProcReqs.length?myProcReqs.map(r=>{
      const items=r.items_edited||r.items||[];
      const editedTag=r.items_edited?'<span style="font-size:10px;color:var(--amber)">(edited)</span>':'';
      return `<div style="padding:12px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span>From <strong>${r.contractor_name}</strong> · ${(r.created_at||'').slice(0,10)} · ${items.length} items ${editedTag}</span>
          ${procStatusBadge(r.status)}
        </div>
        ${r.status==='submitted'||r.status==='sent_to_contractor'?`<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="zadd" data-procexport="${r.id}" style="font-size:10px;padding:4px 8px">⊞ EXPORT TO EXCEL</button>
          <label class="zadd" style="font-size:10px;padding:4px 8px;cursor:pointer">↑ IMPORT EDITED<input type="file" data-procimport="${r.id}" accept=".xlsx,.xls" style="display:none"></label>
          <button class="add" data-sendtocontractor="${r.id}" style="font-size:10px;padding:4px 8px">📤 SEND TO SUPERVISOR</button>
        </div>`
        :r.status==='contractor_confirmed'?`<div style="font-size:11px;color:var(--blue);margin-top:6px">✓ Confirmed by the supervisor — waiting for manager approval to purchase.</div>`
        :r.status==='approved_for_purchase'?`<div style="margin-top:8px">
          <div style="font-size:11px;color:var(--green);margin-bottom:6px">✓ Approved for purchasing by ${r.manager_approval_1_by||'manager'}. Send the LPO to your supplier.</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select class="sel" data-lposupplier="${r.id}" style="padding:6px">
              <option value="">— pick supplier —</option>
              ${allSuppliers().map(sp=>`<option value="${sp}">${sp}</option>`).join('')}
            </select>
            <button class="add" data-sendlpo="${r.id}" style="font-size:10px;padding:5px 12px">📤 SEND LPO</button>
          </div></div>`
        :r.status==='lpo_sent'?`<div style="margin-top:8px">
          <div style="font-size:11px;color:var(--amber);margin-bottom:6px">LPO sent to ${r.supplier_name||'supplier'}${r.lpo_sent_at?' on '+String(r.lpo_sent_at).slice(0,10):''}. Upload their response to send it back for final approval.</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="zadd" style="font-size:10px;padding:5px 12px;cursor:pointer">📄 UPLOAD SUPPLIER RESPONSE<input type="file" data-supresp="${r.id}" style="display:none"></label>
            <button class="zadd" data-printlpo="${r.id}" style="font-size:10px;padding:5px 12px">🖨 REPRINT LPO</button>
          </div></div>`
        :r.status==='supplier_responded'?`<div style="font-size:11px;color:var(--blue);margin-top:6px">Supplier response uploaded — waiting for the manager's final approval.${r.supplier_response_pdf_url?` <a href="${r.supplier_response_pdf_url}" target="_blank" rel="noopener" style="color:var(--blue)">view</a>`:''}</div>`
        :r.status==='approved_final'?`<div style="font-size:11px;color:var(--green);margin-top:6px">✓ Final approval by ${r.manager_approval_2_by||'manager'} — purchase complete. <button class="zadd" data-printlpo="${r.id}" style="font-size:10px;padding:3px 8px">🖨 LPO</button></div>`
        :r.status==='rejected'?`<div style="font-size:11px;color:var(--red);margin-top:6px">✕ Rejected${r.reject_note?': '+r.reject_note:''}</div>`
        :''}
      </div>`;
    }).join(''):'<div class="empty">No material requests for this project yet.</div>'}
  </div>`:'';
  return `<div class="hint" style="padding-top:14px">Each supplier's order is its own card below — submit it for approval, track its status, message about it, and get its certificate all in one place. Choose a different supplier per card if you want to send the same items elsewhere.</div>
    ${procSection}
    ${store.account.accountType==='procurement'?'':supplierCards}
    ${store.account.accountType==='procurement'?'':wholeOrderCard}
    ${store.account.accountType==='procurement'?'':`<button class="bigPrint" id="printOrder">⊞ EXPORT FULL ESTIMATE TO EXCEL</button>`}
    ${store.account.accountType==='procurement'?'':costSummary}${procReqViewOverlay()}`;}

function zoneSel(val,kind,id){return `<select class="sel" data-${kind}="${id}" data-k="zone">${store.zones.map(z=>`<option value="${z.id}" ${z.id===val?'selected':''}>${z.name}</option>`).join('')}</select>`;}
function partSel(val,other,id){
  const list=mergedTypes(PART_TYPES,store.customPartTypes);
  const isOther=(val==='Other');
  const dd=`<select class="sel" style="width:96px" data-sheet="${id}" data-k="part">${list.map(p=>`<option value="${p}" ${p===(val||'')?'selected':''}>${p||'— part —'}</option>`).join('')}</select>`;
  const tx=isOther?`<input class="cell" style="width:90px;margin-top:4px" value="${other||''}" data-sheet="${id}" data-k="partOther" placeholder="type part">`:'';
  return `<div style="display:flex;flex-direction:column">${dd}${tx}</div>`;
}
function itemSel(val,other,id){
  const list=mergedTypes(ITEM_TYPES,store.customItemTypes);
  const isOther=(val==='Other');
  const dd=`<select class="sel" style="width:120px" data-sheet="${id}" data-k="item">${list.map(p=>`<option value="${p}" ${p===(val||'')?'selected':''}>${p||'— item —'}</option>`).join('')}</select>`;
  const tx=isOther?`<input class="cell" style="width:110px;margin-top:4px" value="${other||''}" data-sheet="${id}" data-k="itemOther" placeholder="type item">`:'';
  return `<div style="display:flex;flex-direction:column">${dd}${tx}</div>`;
}
// the effective item name for a row (custom text if Other, else the dropdown value)
function itemName(r){return (r.item==='Other'?(r.itemOther||'Other'):(r.item||''));}
// finish choice per piece: none / prime / paint / both
function finishSel(val,id){const opts=[['none','None'],['prime','Prime only'],['paint','Paint only'],['both','Prime+Paint']];return `<select class="sel" style="width:104px" data-sheet="${id}" data-k="pfinish">${opts.map(o=>`<option value="${o[0]}" ${(val||'none')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;}
function paintFacesSel(val,id){const opts=[[1,'1 face'],[2,'2 faces']];return `<select class="sel" style="width:74px" data-sheet="${id}" data-k="paintFaces">${opts.map(o=>`<option value="${o[0]}" ${(+val||1)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;}
function pieceRef(r,idx){
  const proj=(store.projectName||'PRJ').replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase()||'PRJ';
  const zone=(store.zones.find(z=>z.id===r.zone)||{}).name||('Z'+r.zone);
  const z=zone.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
  const part=(r.part||'PT').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
  return `${proj}-${z}-${part}-${String(idx+1).padStart(2,'0')}`;
}
function lipSel(val,id){return `<select class="sel" data-sheet="${id}" data-k="lip">${LIP_PRESETS.map(mm=>`<option value="${mm}" ${mm===val?'selected':''}>${store.unit==='mm'?mm:(mm/MM_PER_IN).toFixed(2)}</option>`).join('')}</select>`;}
function edgeSel(val,id){return `<select class="sel" data-sheet="${id}" data-k="edge">${EDGE_OPTS.map(o=>`<option value="${o.v}" ${o.v===(val||'0')?'selected':''}>${o.t}</option>`).join('')}</select>`;}

function wire(){
  if(!store.account){
    document.querySelectorAll('[data-authmode]').forEach(b=>b.onclick=()=>{store.authMode=b.dataset.authmode;store.authMsg='';render();});
    document.querySelectorAll('[data-signuptype]').forEach(b=>b.onclick=()=>{store.signupType=b.dataset.signuptype;store.authMsg='';render();});
    const sErr=t=>{store.authBusy=false;store.authMsg=t;render();};
    const su=document.getElementById('doSignup');
    if(su)su.onclick=async()=>{
      const c=val('f_company'),n=val('f_name'),e=val('f_email'),p=val('f_phone'),l=val('f_location'),pw=document.getElementById('f_pass').value;
      if(!c||!n||!e||!pw){return sErr('Please fill company, name, email and password.');}
      if(!/^[^@]+@[^@]+\.[^@]+$/.test(e)){return sErr('Please enter a valid email.');}
      if(pw.length<6){return sErr('Password must be at least 6 characters.');}
      if(!sb){return sErr('No connection to Supabase.');}
      store.authBusy=true;store.authMsg='';render();
      try{
        await sb.auth.signOut();
        const {data,error}=await sb.auth.signUp({email:e,password:pw});
        if(error)return sErr(error.message);
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          return sErr('That email is already registered. Please sign in instead, or use a different email.');
        }
        // make sure we have an active session before writing (RLS needs it)
        let {data:sess}=await sb.auth.getSession();
        if(!sess.session){ await sb.auth.signInWithPassword({email:e,password:pw}); }

        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){

// parse pasted/CSV rows: type,supplier,code,thk,len_or_w,h,price
function importRows(text){
  if(!text||!text.trim()){return;}
  const lines=text.trim().split(/\r?\n/).map(l=>l.split(/[,\t]/).map(c=>c.trim()));
  let added=0;
  lines.forEach(c=>{
    if(c.length<4)return;
    const type=(c[0]||'').toLowerCase();
    if(!['linear','sheet','paint'].includes(type))return; // skips header row
    const supplier=c[1]||'', code=c[2]||'';
    if(type==='linear'){const thk=+c[3]||0,len=Math.round(toMM(+c[4]||0)),price=+c[6]||+c[5]||0;if(code&&len){store.priceBook.linear.push({supplier,code,thk,len,price});added++;}}
    else if(type==='sheet'){const thk=+c[3]||0,w=Math.round(toMM(+c[4]||0)),h=Math.round(toMM(+c[5]||0)),price=+c[6]||0;if(code&&w&&h){store.priceBook.sheet.push({supplier,code,thk,w,h,price});added++;}}
    else if(type==='paint'){const price=+c[6]||+c[3]||0;if(code){store.priceBook.paint.push({supplier,code,price});added++;}}
  });
  render();
  const msg=document.getElementById('importMsg');if(msg)msg.textContent=added?`✓ Imported ${added} row(s)`:'No valid rows found — check the column order.';
}

// Reliably create/find a company and link the contractor's profile to it.
// Waits for the profile row (created by a DB trigger) and verifies the save.
async function linkContractorCompany(uid,companyName,fullName,phone,location){
  if(!sb||!uid)return;
  // 1) ensure the profile row exists (trigger may lag right after signup)
  let profExists=false;
  for(let i=0;i<5 && !profExists;i++){
    try{const {data}=await sb.from('profiles').select('id').eq('id',uid).maybeSingle();if(data)profExists=true;}catch(e){}
    if(!profExists)await new Promise(r=>setTimeout(r,500));
  }
  // 2) find existing company by name, else create it
  let companyId=null;
  try{const {data:found}=await sb.from('companies').select('id').eq('name',companyName).maybeSingle();if(found)companyId=found.id;}catch(e){}
  if(!companyId){
    try{const {data:co}=await sb.from('companies').insert({name:companyName}).select().single();if(co)companyId=co.id;}catch(e){}
  }
  // 3) update the profile, retry until it sticks
  for(let i=0;i<4;i++){
    try{await sb.from('profiles').update({full_name:fullName,phone:phone,location:location,company_id:companyId,role:'owner',account_type:'contractor'}).eq('id',uid);}catch(e){}
    // verify
    try{const {data:chk}=await sb.from('profiles').select('company_id').eq('id',uid).maybeSingle();if(chk&&chk.company_id)return;}catch(e){}
    await new Promise(r=>setTimeout(r,500));
  }
}

        <span style="color:#555;font-size:12px">supplier profile</span>

      <div style="background:#12181f;border:1px solid #223;border-radius:12px;padding:24px;margin-bottom:24px">
        <div style="font-size:22px;font-weight:800">${companyName||prof.full_name||'Supplier'}</div>
        ${companyName&&prof.full_name?`<div style="font-size:13px;color:#888;margin-top:2px">${prof.full_name}</div>`:''}
        ${kinds.length?`<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${kinds.map(k=>`<span style="font-size:11px;padding:3px 10px;border-radius:12px;background:#1c2733;color:#8ec6ff">${k}</span>`).join('')}</div>`:''}
        ${prof.phone?`<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
          <a href="tel:${prof.phone}" style="font-size:12px;padding:8px 14px;border-radius:6px;background:#1c2733;color:#8ec6ff;text-decoration:none">📞 Call</a>
          <a href="https://wa.me/${String(prof.phone).replace(/[^0-9]/g,'')}" target="_blank" rel="noopener" style="font-size:12px;padding:8px 14px;border-radius:6px;background:#1c2733;color:#8ec6ff;text-decoration:none">💬 WhatsApp</a>
        </div>`:''}
      </div>
      <div style="font-size:12px;color:#666;margin-bottom:10px">${items.length} item${items.length===1?'':'s'} listed</div>
      ${items.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
        ${shown.slice(0,60).map(r=>{
          const spec=[r.thk?`${r.thk}mm`:'',r.width&&r.height?`${r.width}×${r.height}`:'',r.litres?`${r.litres}L`:''].filter(Boolean).join(' · ');
          const ph=Array.isArray(r.photos)&&r.photos.length?r.photos[0]:'';
          return `<div style="background:#12181f;border:1px solid #223;border-radius:8px;overflow:hidden">
            ${ph?`<img src="${ph}" style="width:100%;height:130px;object-fit:cover">`:`<div style="width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:#1a222c;color:#555;font-size:11px">no photo</div>`}
            <div style="padding:10px">
              <div style="font-size:12px;font-weight:700">${r.description||r.code||'—'}</div>
              ${spec?`<div style="font-size:10px;color:#777;margin-top:2px">${spec}</div>`:''}
            </div></div>`;
        }).join('')}
      </div>`:`<div style="color:#666;font-size:13px;padding:20px 0">This supplier hasn't listed any materials yet.</div>`}
      <div style="margin-top:40px;padding-top:20px;border-top:1px solid #223;text-align:center">
        <div style="font-size:13px;color:#999;margin-bottom:10px">Want to order from ${companyName||'this supplier'} directly, or list your own materials?</div>
        <a href="${window.location.origin}${window.location.pathname}" style="display:inline-block;padding:10px 20px;background:#5db8ff;color:#001;border-radius:6px;font-weight:700;font-size:13px;text-decoration:none">Join FIT-OUT IQ →</a>
      </div>
    </div></div>`;
}
async function loadSession(){
  if(!sb){render();return;}
  let session=null;
  try{
    const res=await withTimeout(sb.auth.getSession(),12000,'Loading your session');
    session=res.data?res.data.session:null;
  }catch(ex){
    // Supabase unreachable/slow — don't hang. Show the login screen with a notice.
    store.account=null;store.authBusy=false;
    store.authMsg=(ex.message||'Could not reach the server.')+' ';
    render();return;
  }
  if(!session){store.account=null;store.authBusy=false;render();return;}
  const uid=session.user.id;
  let prof=null;
  // Read the profile; retry once after a short wait if it's not ready yet
  // (right after login the row/policies can lag, which previously defaulted
  // everyone to 'contractor' and sent managers to the wrong screen).
  for(let attempt=0;attempt<2 && !prof;attempt++){
    try{const {data}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();prof=data;}catch(e){}
    if(!prof&&attempt===0){await new Promise(r=>setTimeout(r,600));}
  }
  let companyName='';
  if(prof&&prof.company_id){try{const {data:co}=await sb.from('companies').select('name').eq('id',prof.company_id).maybeSingle();companyName=co?co.name:'';}catch(e){}}
  // Determine account type robustly: trust profiles.account_type, but if a
  // supplier_profiles row exists for this user, they are a supplier regardless.
  let acctType=prof?(prof.account_type||'contractor'):'contractor';
  let supplierName='';
  try{
    const {data:sp}=await sb.from('supplier_profiles').select('supplier_name').eq('id',uid).maybeSingle();
    if(sp){ acctType='supplier'; supplierName=sp.supplier_name||''; }
  }catch(e){}
  store.account={
    uid, email:session.user.email, accountType:acctType,
    company:acctType==='supplier'?(supplierName||'(supplier)'):(companyName||'(no company)'), companyId:prof?prof.company_id:null,
    name:prof?prof.full_name:'', phone:prof?prof.phone:'', location:prof?prof.location:'',
    role:prof?prof.role:'member', plan:prof?prof.plan:'trial',
    trialEnds:prof?prof.trial_ends:new Date(Date.now()+30*864e5).toISOString(),
  };
  store.authBusy=false;store.authMsg='';
  // Clear any workspace data cached in this browser from a *different* account,
  // so a freshly-logged-in account starts from its own cloud data, not leftovers.
  if(store._loadedUid!==uid){
    store.zones=[{id:1,name:'Zone 1'}]; store.zoneFilter='all';
    store.linRows=[{id:Date.now(),zone:1,label:'Stud',code:'STUD-92',thk:92,len:2400,qty:10}]; store.sheetRows=[]; store.paintRows=[];
    store.assemblyRows=[]; store.customAssemblies=[]; store.bankedDrops=[];
    _workspaceId=null; store.projectName='My First Project';
    store.projects=[]; store.projectsLoaded=false;
    store.myOrders=[]; store.myOrdersLoaded=false;
    store._loadedUid=uid;
  }
  if(acctType!=='supplier'){ await cloudLoad(); }
  subscribeOrders();
  loadUnread();
  render();
}
// react to auth changes (magic-link return, token refresh)
if(sb){ sb.auth.onAuthStateChange((event,_s)=>{ if(event==='PASSWORD_RECOVERY'){ store.showResetPassword=true; render(); } else { loadSession(); } }); }
{
  const __profileParam=new URLSearchParams(window.location.search).get('profile');
  if(__profileParam){ loadPublicProfile(__profileParam); }
  else { loadSession(); }
}
</script>
